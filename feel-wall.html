<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>酸の壁を築く 実験</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;
    font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#eee;
    touch-action:none;overscroll-behavior:none}
  canvas{position:absolute;inset:0;width:100%;height:100dvh;display:block}
  #hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;text-align:center;
    pointer-events:none;z-index:5}
  #hud .row{font-size:13px;color:#bfe9d2;letter-spacing:.03em}
  #hud .row b{font-size:23px;color:#8ff0c0;font-weight:800}
  #hud .best{font-size:11.5px;color:#7a8a86;margin-top:1px}
  #bar{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);
    width:190px;height:6px;background:#22303a;border-radius:99px;overflow:hidden;z-index:5;pointer-events:none}
  #barIn{height:100%;width:100%;background:linear-gradient(90deg,#8ff0c0,#5fd6a4);transition:width .2s}
  .btn{position:absolute;top:calc(env(safe-area-inset-top) + 10px);
    font:inherit;font-size:12px;font-weight:700;color:#0b0f14;background:#8ff0c0;border:0;border-radius:999px;
    padding:7px 14px;z-index:6}
  #reset{right:12px}
  #tip{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:0;right:0;text-align:center;
    font-size:12px;line-height:1.5;color:#6f7d84;padding:0 16px;z-index:5;pointer-events:none;transition:opacity .4s}
  #over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,12,16,.86);z-index:10;text-align:center;padding:20px}
  #over.on{display:flex}
  #over .t{font-size:22px;font-weight:800;color:#ff9a80;margin-bottom:6px}
  #over .s{font-size:14px;color:#bfe9d2;margin-bottom:20px;line-height:1.8}
  #over button{font:inherit;font-size:15px;font-weight:800;color:#0b0f14;background:#8ff0c0;border:0;
    border-radius:999px;padding:12px 26px}
  #ver{position:fixed;left:8px;bottom:5px;font-size:10px;letter-spacing:.02em;
    color:#41525b;z-index:20;pointer-events:none;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ver"></div>
<div id="hud">
  <div class="row">守った <b id="sec">0</b> 秒</div>
  <div class="best" id="best"></div>
</div>
<div id="bar"><div id="barIn"></div></div>
<div id="tip">なぞって乳酸菌を集め 指を離すとその場に酸の壁になる。腐敗の面を堰き止めろ</div>
<button id="reset" class="btn">やり直す</button>
<div id="over">
  <div class="t">漬物が腐ってしまった</div>
  <div class="s" id="overS"></div>
  <button id="again">もう一度</button>
</div>

<script>
'use strict';
// 公開ごとに stamp.py が書き換える。画面左下に出して、更新されたか一目で分かるようにする
const BUILD='v113 (07-30 16:58)';
try{ document.getElementById('ver').textContent=BUILD; }catch(e){}
// ============================================================
//  案1「酸の壁を築く」
//  ・腐敗は"点の敵"ではなく、角度ごとの侵食半径 rot[] が中心へ迫る"面"。
//    → ぶつかるという概念が存在しない。ミスは即死でなく劣化。
//  ・集めた乳酸菌(球菌=ロイコノストック等。鎖状に連なるのは球菌が典型)は
//    指を離した位置に定着して壁になる（運び続ける荷物ではない）。
//  ・壁に隙間があると腐敗が横に染み出して裏へ回る＝隙間を作らない動機。
// ============================================================
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const elSec=document.getElementById('sec'), elBest=document.getElementById('best'), elBar=document.getElementById('barIn');
let W,H,DPR,CX,CY;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
  CX=W/2; CY=(PLAY_TOP+playBot())/2;
}
window.addEventListener('resize',()=>{resize();});

const SCALE=1.25;
// ★菌の形。rod=桿菌(ラクトバチルス) / cocci=球菌(ロイコノストック等・鎖状に連なる)
//   ?shape=cocci で切替。乳酸菌には桿菌も球菌もいるが、"鎖状に連なる"のは球菌が典型
// 既定は球菌。桿菌だと間隔(19.4px)より菌の長さ(18.8px)が近く、鎖が1本の管に
// 融合して"何本繋がっているか"が見えなくなる（本数=力の仕様上これは致命的）
const SHAPE=(new URLSearchParams(location.search).get('shape')==='rod')?'rod':'cocci';
const RLEN=15*SCALE, RW=6.2*SCALE;
const SPACING=(SHAPE==='cocci'? 10.2:15.5)*SCALE;
const CATCH_R=40*SCALE;

const PLAY_TOP=100;
function playBot(){ return H-40; }

const FOOD_R=44;                 // 中央の漬物
const SECT=90;                   // 腐敗の角度分割
const ROT_V0=11;                 // 侵食の初速(px/秒)
const ROT_ACC=0.09;              // 1秒ごとに増える侵食速度
const LATERAL=22;                // 隙間から横へ染み出す速さ(px/秒)。基本速度の2倍程度に
                                 // 抑える（強すぎると境界が真円に均されて形が消える）
const EAT=0.28;                  // 壁1本を食い切る速さ(hp/秒)＝約3.6秒で1本
const EAT_DEEP=1.5;              // 腐敗の内側に置いた壁が食われる速さ
const BLOCK_PAD=7;               // 壁が侵食を止める余裕
const FREE_MAX=42;               // 浮遊している桿菌の上限
const SPAWN_EVERY=0.55;          // 桿菌が湧く間隔(秒)

let rot=[], food=1, alive=true, elapsed=0, clock=0, shake=0;
let free=[], placed=[], bits=[], sparks=[];
let best=+(localStorage.getItem('wallBest')||0);
let maxR=600, spawnT=0, hudT=0;

function rnd(a,b){return a+Math.random()*(b-a);}
function angIdx(a){ let i=Math.floor((a+Math.PI)/(Math.PI*2)*SECT); return ((i%SECT)+SECT)%SECT; }
function idxAng(i){ return -Math.PI + (i+0.5)/SECT*Math.PI*2; }
// ★侵食は「円」ではなく「画面の縁」から始める。円だと狭い画面では左右から先に
//   来て上下が遅れ、壁を置いても画面外になる角度が出る。縁からなら全方位が均等
let edgeR=[];
function edgeRadius(a){
  const c=Math.cos(a), sn=Math.sin(a);
  let t=Infinity;
  if(c>1e-6) t=Math.min(t,(W-6-CX)/c); else if(c<-1e-6) t=Math.min(t,(6-CX)/c);
  if(sn>1e-6) t=Math.min(t,(playBot()-6-CY)/sn); else if(sn<-1e-6) t=Math.min(t,(PLAY_TOP+6-CY)/sn);
  return Math.max(FOOD_R+20, t);
}

function reset(){
  resize();
  edgeR=new Array(SECT); for(let i=0;i<SECT;i++) edgeR[i]=edgeRadius(idxAng(i));
  maxR=Math.max.apply(null,edgeR);
  rot=edgeR.slice();
  food=1; alive=true; elapsed=0; shake=0; spawnT=0;
  free=[]; placed=[]; bits=[]; sparks=[];
  for(let i=0;i<18;i++) spawnFree();
  chain=[]; path=[]; dragging=false; joinedCount=0;
  document.getElementById('over').classList.remove('on');
  document.getElementById('tip').style.opacity=1;
  updateHud();
}
function spawnFree(){
  if(free.length>=FREE_MAX) return;
  // 安全圏（侵食の内側）にだけ湧く。漬物の周りは避ける
  for(let t=0;t<20;t++){
    const a=Math.random()*Math.PI*2;
    const lim=rot[angIdx(a)]-26;
    if(lim<FOOD_R+34) continue;
    const d=rnd(FOOD_R+28, lim);
    const x=CX+Math.cos(a)*d, y=CY+Math.sin(a)*d;
    if(y<PLAY_TOP+10||y>playBot()-10||x<16||x>W-16) continue;
    free.push({x,y,ang:Math.random()*Math.PI,phase:Math.random()*6.28,joined:false,pop:1});
    return;
  }
}
function updateHud(){
  elSec.textContent=Math.floor(elapsed);
  elBar.style.width=Math.max(0,food*100).toFixed(1)+'%';
  elBest.textContent= best? 'これまで最長 '+best+' 秒 ／ 壁 '+placed.length+'本' : '壁 '+placed.length+'本';
}
function tipMsg(t){ const e=document.getElementById('tip'); e.textContent=t; e.style.opacity=1; }

// ---------------- 集める（feel-chain の手触りをそのまま） ----------------
let dragging=false, path=[], chain=[], orderSeq=0, joinedCount=0;
let head={x:0,y:0}, prevHead={x:0,y:0};
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function start(x,y){
  dragging=true; path=[{x,y}]; head={x,y}; prevHead={x,y};
  ac(); catchNear(x,y);
}
function moveTo(x,y){
  if(!dragging||!alive) return;
  const last=path[path.length-1];
  if(Math.hypot(x-last.x,y-last.y)>3){ path.push({x,y}); if(path.length>400)path.shift(); }
  head={x,y}; catchNear(x,y);
}
function catchNear(x,y){
  for(const r of free){
    if(r.joined) continue;
    if(Math.hypot(r.x-x,r.y-y)<=CATCH_R){
      r.joined=true; r.order=orderSeq++; r.b=null; r.follow=0.30;
      chain.push(r); joinedCount=chain.length;
      pop(joinedCount);
    }
  }
}
// 指を離す＝その場に定着して壁になる
function release(){
  dragging=false;
  if(chain.length===0){ path=[]; return; }
  let n=0;
  for(const r of chain){
    placed.push({x:r.x, y:r.y, ang:r.ang, hp:1, set:1, phase:Math.random()*6.28});
    n++;
  }
  free=free.filter(r=>!r.joined);
  for(const r of chain) for(let i=0;i<3;i++)
    sparks.push({x:r.x,y:r.y,vx:rnd(-.7,.7),vy:rnd(-.9,.2),life:1});
  chain=[]; joinedCount=0; path=[]; orderSeq=0;
  setSnd(n); updateHud();
  if(n>=8) tipMsg('長い壁ほど広い角度を守れる');
}
cv.addEventListener('mousedown',e=>{if(!alive)return;const p=pos(e);start(p.x,p.y);});
cv.addEventListener('mousemove',e=>{const p=pos(e);moveTo(p.x,p.y);});
window.addEventListener('mouseup',()=>{if(dragging)release();});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(!alive)return;const p=pos(e.changedTouches[0]);start(p.x,p.y);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const p=pos(e.changedTouches[0]);moveTo(p.x,p.y);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(dragging)release();},{passive:false});
cv.addEventListener('touchcancel',e=>{e.preventDefault();if(dragging)release();},{passive:false});
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('again').addEventListener('click',reset);

// ---------------- 腐敗の面 ----------------
const blocker=new Array(SECT);     // 各角度で侵食を止めている壁
function updateRot(dt){
  for(let i=0;i<SECT;i++) blocker[i]=null;
  // 壁を角度に投影（中心に近い壁ほど広い角度を覆う＝引いて守ると効率が上がる）
  for(const w of placed){
    if(w.hp<=0) continue;
    const dx=w.x-CX, dy=w.y-CY, d=Math.hypot(dx,dy);
    if(d<1) continue;
    const a=Math.atan2(dy,dx);
    const half=Math.atan2(RLEN*0.5+RW*0.5+3, Math.max(12,d));
    const span=Math.max(1, Math.round(half/(Math.PI*2/SECT)));
    const c=angIdx(a);
    for(let k=-span;k<=span;k++){
      const i=((c+k)%SECT+SECT)%SECT;
      // その角度で最も外側にある壁が最初に当たる
      if(!blocker[i] || d>blocker[i].d) blocker[i]={w,d};
    }
    w.deep = d > rot[angIdx(a)]+6;   // 腐敗の内側に取り残された壁
  }
  const v=ROT_V0+ROT_ACC*elapsed;
  // ★食われるのは「壁1本につき1回」。覆っている角度の数だけ重複して削ると
  //   広く守る壁ほど早く死ぬ（逆の挙動）ので、当たっている壁を集めてから1回だけ削る
  const eating=new Set();
  for(let i=0;i<SECT;i++){
    const b=blocker[i];
    if(b && rot[i] <= b.d+BLOCK_PAD+10){
      rot[i]=Math.max(rot[i], b.d+BLOCK_PAD);   // 進めない
      eating.add(b.w);
    }else{
      rot[i]-=v*dt;
    }
  }
  for(const w of eating){
    w.hp-=EAT*dt;
    if(w.hp<=0){
      for(let k=0;k<7;k++) bits.push({x:w.x,y:w.y,vx:rnd(-1.1,1.1),vy:rnd(-1.3,.3),life:1,r:rnd(1,2.6),warm:true});
      shake=Math.max(shake,2.5); crumbleSnd();
    }
  }
  // 隙間から横へ染み出す（壁の裏へ回り込む）
  const cp=rot.slice();
  for(let i=0;i<SECT;i++){
    const l=cp[(i-1+SECT)%SECT], r=cp[(i+1)%SECT];
    const t=Math.min(l,r);
    if(t<rot[i]){
      const b=blocker[i];
      const floor=(b&&b.w.hp>0)? b.d+BLOCK_PAD : FOOD_R;
      rot[i]=Math.max(floor, rot[i]-Math.min(rot[i]-t, LATERAL*dt));
    }
  }
  // 漬物に到達したら食われる
  let hit=0;
  for(let i=0;i<SECT;i++){
    if(rot[i]<FOOD_R){ rot[i]=FOOD_R; hit++; }
  }
  if(hit>0){
    food-=(hit/SECT)*0.42*dt;
    if(food<=0){ food=0; if(alive) lose(); }
  }
  // 腐敗の内側に取り残された壁は速く食われる
  for(const w of placed){
    if(w.hp>0 && w.deep){ w.hp-=EAT_DEEP*dt; }
  }
  placed=placed.filter(w=>w.hp>0);
}
function lose(){
  alive=false; dragging=false;
  const s=Math.floor(elapsed);
  if(s>best){ best=s; localStorage.setItem('wallBest',best); }
  document.getElementById('overS').innerHTML='守った時間 <b>'+s+' 秒</b><br>これまで最長 '+best+' 秒';
  document.getElementById('over').classList.add('on');
  loseSnd();
}

// ---------------- 音 ----------------
let A=null;
function ac(){ if(!A){ try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(A&&A.state==='suspended')A.resume(); }
function pop(n){ if(!A)return; try{
  const t=A.currentTime, o=A.createOscillator(), gg=A.createGain();
  const base=520+Math.min(n,40)*26;
  o.type='sine'; o.frequency.setValueAtTime(base,t); o.frequency.exponentialRampToValueAtTime(base*1.5,t+0.05);
  gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(0.18,t+0.008); gg.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(gg).connect(A.destination); o.start(t); o.stop(t+0.16);
}catch(e){} }
function setSnd(n){ if(!A)return; try{     // 壁が定着する「コトッ」＋和音
  const t=A.currentTime;
  const o=A.createOscillator(), og=A.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(170,t+0.12);
  og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.16,t+0.01); og.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  o.connect(og).connect(A.destination); o.start(t); o.stop(t+0.2);
  const chord=430+Math.min(n,24)*14;
  [0,7].forEach((iv,k)=>{ const s=A.createOscillator(), sg=A.createGain();
    s.type='sine'; s.frequency.value=chord*Math.pow(2,iv/12);
    sg.gain.setValueAtTime(0.0001,t+k*0.04); sg.gain.exponentialRampToValueAtTime(0.09,t+0.02+k*0.04); sg.gain.exponentialRampToValueAtTime(0.0001,t+0.3+k*0.04);
    s.connect(sg).connect(A.destination); s.start(t+k*0.04); s.stop(t+0.34+k*0.04); });
}catch(e){} }
function crumbleSnd(){ if(!A)return; try{
  const t=A.currentTime, dur=0.16;
  const buf=A.createBuffer(1,Math.ceil(A.sampleRate*dur),A.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++){ const e=1-i/ch.length; ch[i]=(Math.random()*2-1)*e*e; }
  const src=A.createBufferSource(); src.buffer=buf;
  const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1200;
  const gg=A.createGain(); gg.gain.setValueAtTime(0.07,t); gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(lp).connect(gg).connect(A.destination); src.start(t); src.stop(t+dur);
}catch(e){} }
function loseSnd(){ if(!A)return; try{
  const t=A.currentTime, o=A.createOscillator(), og=A.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(70,t+0.9);
  og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.14,t+0.03); og.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
  o.connect(og).connect(A.destination); o.start(t); o.stop(t+1.05);
}catch(e){} }

// ---------------- 鎖の追従（軌跡上をバネで＝確定済みの手触り） ----------------
function pointBack(d){
  let acc=0;
  for(let i=path.length-1;i>0;i--){
    const a=path[i], b=path[i-1];
    const seg=Math.hypot(a.x-b.x,a.y-b.y);
    if(acc+seg>=d){ const t=(d-acc)/Math.max(0.001,seg);
      return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
    acc+=seg;
  }
  const p=path[0]||head; return {x:p.x,y:p.y};
}

// ---------------- 描画 ----------------
function drawRod(x,y,ang,mode,hp){
  g.save(); g.translate(x,y); g.rotate(ang);
  if(mode==='chain'){ g.shadowColor='rgba(140,240,200,.9)'; g.shadowBlur=10; g.fillStyle='#c8ffe6'; g.strokeStyle='rgba(120,235,190,.9)'; }
  else if(mode==='wall'){
    const k=Math.max(0,Math.min(1,hp));
    g.shadowColor='rgba(150,245,205,'+(0.5*k)+')'; g.shadowBlur=8;
    g.fillStyle='rgba('+Math.round(190+30*k)+',255,225,'+(0.32+0.68*k)+')';
    g.strokeStyle='rgba(120,235,190,'+(0.4+0.5*k)+')';
  }
  else { g.fillStyle='#dfeef0'; g.strokeStyle='rgba(120,150,160,.5)'; }
  g.lineWidth=1;
  if(SHAPE==='cocci'){
    const R=RW*(mode==='free'? 1.02:0.92);
    g.beginPath(); g.arc(0,0,R,0,7); g.fill(); g.stroke();
    if(mode==='free'){   // 溶けカス粒子と区別するため細胞壁の輪郭を足す
      g.beginPath(); g.arc(0,0,R+1.6,0,7);
      g.strokeStyle='rgba(150,190,200,.55)'; g.lineWidth=1.2; g.stroke();
    }
    g.beginPath(); g.arc(-R*0.28,-R*0.28,R*0.34,0,7);
    g.fillStyle='rgba(255,255,255,.28)'; g.fill();
  }else{
    const h=RLEN/2, w=RW/2;
    g.beginPath(); g.arc(-h,0,w,Math.PI/2,Math.PI*1.5); g.arc(h,0,w,-Math.PI/2,Math.PI/2); g.closePath();
    g.fill(); g.stroke();
  }
  g.restore(); g.shadowBlur=0;
}
function drawRot(){
  // 侵食の内側境界を多角形にして、外側を塗る（evenodd で穴あき塗り）
  g.save();
  g.beginPath();
  g.rect(-40,-40,W+80,H+80);
  g.moveTo(CX+Math.cos(idxAng(0))*rot[0], CY+Math.sin(idxAng(0))*rot[0]);
  for(let i=1;i<SECT;i++){
    const a=idxAng(i);
    g.lineTo(CX+Math.cos(a)*rot[i], CY+Math.sin(a)*rot[i]);
  }
  g.closePath();
  const gr=g.createRadialGradient(CX,CY,FOOD_R,CX,CY,maxR);
  gr.addColorStop(0,'rgba(150,70,105,.92)'); gr.addColorStop(1,'rgba(72,30,52,.96)');
  g.fillStyle=gr; g.fill('evenodd');
  // 境界の縁取り
  g.beginPath();
  for(let i=0;i<=SECT;i++){
    const j=i%SECT, a=idxAng(j);
    const x=CX+Math.cos(a)*rot[j], y=CY+Math.sin(a)*rot[j];
    i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath();
  g.strokeStyle='rgba(230,140,180,.55)'; g.lineWidth=2; g.stroke();
  g.restore();
}
function drawFood(){
  const k=Math.max(0,food);
  g.save(); g.translate(CX,CY);
  g.beginPath();
  for(let i=0;i<=24;i++){
    const a=i/24*Math.PI*2, rr=FOOD_R*(0.9+Math.sin(a*3+clock*0.6)*0.06);
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr; i?g.lineTo(x,y):g.moveTo(x,y);
  }
  g.closePath();
  const gr=g.createRadialGradient(0,-8,4,0,0,FOOD_R);
  gr.addColorStop(0,'rgba(226,236,180,'+(0.45+0.5*k)+')');
  gr.addColorStop(1,'rgba(150,170,110,'+(0.30+0.45*k)+')');
  g.fillStyle=gr; g.fill();
  g.strokeStyle='rgba(240,250,205,'+(0.25+0.4*k)+')'; g.lineWidth=1.5; g.stroke();
  // 残量リング
  g.beginPath(); g.arc(0,0,FOOD_R+7,-Math.PI/2,-Math.PI/2+Math.PI*2*k);
  g.strokeStyle='rgba(143,240,192,.75)'; g.lineWidth=3; g.stroke();
  g.restore();
}
let tms=0;
function loop(ts){
  const dt=Math.min(0.05,(tms?ts-tms:16)/1000); tms=ts; clock+=dt;
  if(alive){
    elapsed+=dt;
    updateRot(dt);
    spawnT+=dt; if(spawnT>=SPAWN_EVERY){ spawnT=0; spawnFree(); }
    hudT+=dt; if(hudT>=0.25){ hudT=0; updateHud(); }
  }

  g.save();
  if(shake>0.2){ const s=shake; g.translate(rnd(-s,s),rnd(-s,s)); shake*=0.86; } else shake=0;
  g.clearRect(-40,-40,W+80,H+80);
  const bg=g.createRadialGradient(CX,CY,40,CX,CY,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#12202a'); bg.addColorStop(1,'#0b0f14'); g.fillStyle=bg; g.fillRect(-40,-40,W+80,H+80);

  drawRot();
  drawFood();

  // 溶けカス
  for(const b of bits){ b.x+=b.vx; b.y+=b.vy; b.vy+=0.05; b.life-=dt*1.5;
    if(b.life>0){ g.beginPath(); g.arc(b.x,b.y,b.r*b.life,0,7);
      g.fillStyle=b.warm? 'rgba(255,170,140,'+(0.7*b.life)+')' : 'rgba(160,245,200,'+(0.7*b.life)+')'; g.fill(); } }
  bits=bits.filter(b=>b.life>0);
  for(const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.life-=dt*2.2;
    if(s.life>0){ g.beginPath(); g.arc(s.x,s.y,2.4*s.life,0,7); g.fillStyle='rgba(200,255,230,'+(0.8*s.life)+')'; g.fill(); } }
  sparks=sparks.filter(s=>s.life>0);

  // 定着した壁
  for(const w of placed){ w.phase+=dt; if(w.set>0) w.set-=dt*3;
    drawRod(w.x,w.y,w.ang,'wall',w.hp);
    if(w.set>0){ g.beginPath(); g.arc(w.x,w.y,10+22*(1-w.set),0,7);
      g.strokeStyle='rgba(180,255,220,'+(0.5*w.set)+')'; g.lineWidth=2; g.stroke(); }
  }

  // 浮遊している桿菌
  for(const r of free){ if(r.joined) continue;
    r.phase+=dt*1.5;
    if(r.pop>0){ r.pop-=dt*3; }
    if(dragging){ const d=Math.hypot(r.x-head.x,r.y-head.y);
      if(d<CATCH_R*2.2){ const a=Math.atan2(head.y-r.y,head.x-r.x);
        let da=a-r.ang; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
        r.ang+=da*(1-d/(CATCH_R*2.2))*0.12; } }
    drawRod(r.x,r.y,r.ang+Math.sin(r.phase)*0.06,'free');
  }

  // なぞり線＋鎖（軌跡上をバネで追従）
  if(dragging && path.length>1){
    g.beginPath(); g.moveTo(path[0].x,path[0].y);
    for(let i=1;i<path.length;i++) g.lineTo(path[i].x,path[i].y);
    g.lineTo(head.x,head.y);
    g.strokeStyle='rgba(140,240,200,.20)'; g.lineWidth=RW+4; g.lineCap='round'; g.lineJoin='round';
    g.shadowColor='rgba(140,240,200,.5)'; g.shadowBlur=10; g.stroke(); g.shadowBlur=0;
  }
  const headAdv=dragging? Math.hypot(head.x-prevHead.x, head.y-prevHead.y):0;
  const sorted=chain.slice().sort((a,b)=>a.order-b.order);
  for(let k=0;k<sorted.length;k++){
    const r=sorted[k], ideal=(sorted.length-1-k+1)*SPACING;
    if(r.b==null) r.b=ideal;
    r.b+=headAdv; r.b+=(ideal-r.b)*0.30;
    if(r.b>ideal+70) r.b=ideal+70;
    const tp=pointBack(r.b);
    r.follow=Math.min(1,(r.follow==null?1:r.follow)+dt*3.5);
    r.x+=(tp.x-r.x)*r.follow; r.y+=(tp.y-r.y)*r.follow;
    const pf=pointBack(Math.max(0,r.b-7)), pb=pointBack(r.b+7);
    const tdx=pf.x-pb.x, tdy=pf.y-pb.y;
    if(Math.abs(tdx)+Math.abs(tdy)>0.5) r.ang=Math.atan2(tdy,tdx);
    drawRod(r.x,r.y,r.ang,'chain');
  }
  if(dragging){
    g.beginPath(); g.arc(head.x,head.y,7,0,7);
    g.fillStyle='rgba(200,255,230,.9)'; g.shadowColor='#8ff0c0'; g.shadowBlur=16; g.fill(); g.shadowBlur=0;
    if(chain.length>0){
      g.save(); g.font='800 18px system-ui,-apple-system,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
      const bx=head.x, by=head.y-52;
      g.beginPath(); g.arc(bx,by,17,0,7); g.fillStyle='rgba(6,14,12,.82)'; g.fill();
      g.strokeStyle='rgba(140,250,200,.95)'; g.lineWidth=2; g.stroke();
      g.fillStyle='#a6ffd4'; g.fillText(chain.length,bx,by+1); g.restore();
    }
  }
  prevHead.x=head.x; prevHead.y=head.y;
  g.restore();
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
window.__dbg={rot:()=>rot,free:()=>free,placed:()=>placed,chain:()=>chain,food:()=>food,
  elapsed:()=>elapsed,alive:()=>alive,minRot:()=>Math.min.apply(null,rot),
  center:()=>({x:CX,y:CY,maxR,FOOD_R})};
</script>
</body>
