<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ズタッと囲う（原点版）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;
    font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#eee;
    touch-action:none;overscroll-behavior:none}
  canvas{position:absolute;inset:0;width:100%;height:100dvh;display:block}
  #hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:0;right:0;text-align:center;
    pointer-events:none;z-index:5}
  #hud .n{font-size:15px;color:#bfe9d2;letter-spacing:.04em}
  #hud .n b{font-size:26px;color:#8ff0c0;font-weight:800}
  #hud .best{font-size:12px;color:#7a8a86;margin-top:2px}
  /* 下部は手が被って死角になるので、操作以外のUIは全て上に寄せる */
  #reset{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;
    font:inherit;font-size:12px;font-weight:700;color:#0b0f14;background:#8ff0c0;border:0;border-radius:999px;
    padding:7px 14px;z-index:6}
  #tip{position:absolute;top:calc(env(safe-area-inset-top) + 74px);left:0;right:0;text-align:center;
    font-size:12px;line-height:1.5;color:#6f7d84;padding:0 14px;
    z-index:5;pointer-events:none;transition:opacity .4s}
  #ver{position:fixed;left:8px;bottom:5px;font-size:10px;letter-spacing:.02em;
    color:#41525b;z-index:20;pointer-events:none;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ver"></div>
<div id="hud"><div class="n">封じた <b id="cnt">0</b></div><div class="best" id="best"></div></div>
<div id="tip">なぞって乳酸菌（桿菌）を繋ぎ 雑菌（ブドウ球菌）を輪で囲め ─ 囲えば溶ける／触れれば弾ける</div>
<button id="reset">まき直す</button>

<script>
'use strict';
// 公開ごとに stamp.py が書き換える。画面左下に出して、更新されたか一目で分かるようにする
const BUILD='v30 (07-28 14:42)';
try{ document.getElementById('ver').textContent=BUILD; }catch(e){}
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const elCnt=document.getElementById('cnt'), elBest=document.getElementById('best');
let W,H,DPR;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

// ============================================================
//  乳酸菌（味方・桿菌）= 拾って鎖を伸ばす
//  腐敗菌（敵・胞子塊）  = なぞりの輪で囲むと酸で溶ける
// ============================================================
// ★実機（4.7インチ=375x667）だと桿菌が2.3mmしかなく小さいので一括で拡大する。
//   見づらい/大きすぎる場合はこの1つだけ触れば全体が揃って変わる
// ★見た目は味方・敵を独立に切り替えられる
//   既定＝味方は桿菌（この手触りが一番良いとユーザー判断）／敵は鞭毛で泳ぐ桿菌。
//   味方は白〜ミントで鞭毛なし、敵はピンクで鞭毛あり＝色と付属器官で区別する。
//   ?player=cocci で味方を球菌に ／ ?foe=blob で敵を以前のトゲの胞子塊に
//   ?look=old は両方まとめて以前の見た目にする近道
const _q=new URLSearchParams(location.search);
const _old=_q.get('look')==='old';
const PLAYER_SHAPE=(_q.get('player')==='cocci')?'cocci':'rod';
// 敵の見た目：既定は球菌の房（ブドウ球菌）。鞭毛の桿菌は生々しくて不評だった。
// 球菌でも「黄色ブドウ球菌＝食中毒菌で、乳酸菌が実際に抑える相手」なので筋は通る。
// ?foe=rod 鞭毛の桿菌 ／ ?foe=blob 以前のトゲの胞子塊
const FOE_SHAPE=(_old||_q.get('foe')==='blob')?'blob':(_q.get('foe')==='rod'?'rod':'cocci');
// ★自由度＝(動ける面積)÷(菌のサイズ^2)。PC版(390x844,SCALE=1.0)は約1044だったが、
//   スマホ(375x667)で見やすさのためSCALE=1.25にしたら467＝PC版の45%まで狭まり、
//   「決まった動きの単純作業」になっていた。SCALE=0.83でPC版と同等の自由度に戻る。
//   ?scale=1.25 のように指定して比べられる
const SCALE=Math.max(0.5, Math.min(2, +(_q.get('scale')||0.85)));
const RLEN=15*SCALE, RW=6.2*SCALE;   // 桿菌の長さ・太さ
const SPACING=(PLAYER_SHAPE==='cocci'? 10.2:15.5)*SCALE;   // 鎖の玉間隔（球菌は詰める）
const CATCH_R=40*SCALE;              // 吸い付く射程
const FOE_R=13*SCALE;                // 腐敗菌の半径

// ★盤面の密度は画面サイズに依らず一定にする。
//   固定数だとSE3(375x667)は390x844比で湧き範囲の面積が68%＝密度が26%上がり渋滞する
const REF_AREA=390*604, RODS_REF=64;
// 敵の密度。狭い画面で通り道が無くなるのが避けられなさの主因なので既定を下げる
const FOES_REF=+(new URLSearchParams(location.search).get('foes')||10);

// 盤面の上下端はここで一元管理する（HUDとボタンを避ける分だけ空ける）
const PLAY_TOP=110;
function playBot(){ return H-120; }
// ★盤面を画面より広くして、鎖の先頭をカメラが追う。
//   PC版の「広い画面で走り回れる」自由度は、画面内の縮尺だけでは戻らない
const WORLD=Math.max(1, Math.min(6, +(_q.get('world')||3)));   // 疾走するマップなので広く
function worldW(){ return W*WORLD; }
function worldBot(){ return PLAY_TOP + (playBot()-PLAY_TOP)*WORLD; }
function playArea(){ return worldW()*Math.max(120, worldBot()-PLAY_TOP); }
let cam={x:0,y:0};
// ※動的ズーム（疾走中だけ画面を引く）は試したが却下。ユーザー評「酔う」。
//   既定は無効(1)。?zoom=0.8 のように指定すれば試せるが、常用はしない
const ZOOM_MIN=Math.max(0.5, Math.min(1, +(_q.get('zoom')||1)));
let zoom=1;
function viewW(){ return W/zoom; }
function viewH(){ return H/zoom; }
function updateZoom(dt){
  if(ZOOM_MIN>=1) return;
  const sp=dragging? Math.hypot(camVel.x,camVel.y) : 0;
  const t=Math.min(1, Math.max(0,(sp-120)/780));
  const want=1-(1-ZOOM_MIN)*t;
  let nz=zoom+(want-zoom)*Math.min(1, dt*(want<zoom? 4.5:1.3));  // 引くのは速く、戻すのは緩やか
  // 世界より広くは引かない（世界の外まで見えると座標の対応が崩れる）
  const zMin=Math.max(W/worldW(), H/(worldBot()+120));
  if(nz<zMin) nz=zMin;
  if(nz>1) nz=1;
  if(Math.abs(nz-zoom)>1e-5){
    // 指の下の世界座標が動かないよう cam を補正（これが無いと拡縮のたびに手元がずれる）
    cam.x+=finger.x/zoom-finger.x/nz;
    cam.y+=finger.y/zoom-finger.y/nz;
    zoom=nz; clampCam();
  }
}
function camMaxX(){ return Math.max(0, worldW()-viewW()); }
function camMaxY(){ return Math.max(0, worldBot()+120-viewH()); }
function clampCam(){
  cam.x=Math.max(0,Math.min(camMaxX(),cam.x));
  cam.y=Math.max(0,Math.min(camMaxY(),cam.y));
}
// ★カメラは「指の画面上の速度」だけで決める。
//   ここが要点：先頭の世界速度から決めると、カメラが動く→先頭が進む→
//   速度が上がったと判定→カメラがもっと動く…と暴走する（前回の失敗）。
//   指の画面速度はプレイヤーの意図そのもので、カメラの動きが混ざらない。
//   ・速く払うほど世界が流れる＝疾走（画面端まで行く必要が無い）
//   ・指を止めれば流れも止まる
//   ・端に押し付けた時は、止まったままでも流し続けられる（追加分）
let finger={x:0,y:0}, prevFinger={x:0,y:0}, fingerVel={x:0,y:0};
// ★曲がっている時はスクロールを止める。
//   これが無いと、輪を描いている間も世界が流れて軌跡が螺旋になり自己交差しない
//   ＝輪が永久に閉じない（実測：中央で半径70pxの円を描く間にカメラが388px流れて0匹）。
//   直進＝疾走、曲がる＝囲みに入る、という切り替えはソニック的な走りと丸まりに対応する。
let turnRate=0, straight=1, strokeT0=-9;
// ★流れに慣性を持たせる。指を端に置き続けないと流れない仕組みだと、走り続ける間
//   ずっと指が端にあり、その先は構造的に見えない＝「先が見えない」の根本原因。
//   勢いをつけたら指を中央に戻しても流れが続くようにすれば、指を中央に置いたまま
//   走れて、進行方向に画面の半分が見える。ソニックの「加速して惰性で走る」に対応。
let camVel={x:0,y:0};
const ACC_UP=7;     // 加速の速さ
const ACC_COAST=1.1;// 指を戻した後の惰性（小さいほど長く流れ続ける）
const ACC_BRAKE=14; // 曲がった時の制動（囲みのために素早く止める）
let dirRef={x:0,y:0,ang:null,t:0};   // 旋回を測る基準点（指の実移動から求める）
const TURN_LO=2.0, TURN_HI=6.0;      // 旋回の速さ(rad/秒)。これ以上でスクロールを止める
// 指が実際に動いた分から旋回の速さを求める。平滑化した速度から向きを出すと
// フレームとタッチイベントのタイミングずれで鈍り、旋回を検出できない
function feedDir(nx,ny){
  const d=Math.hypot(nx-dirRef.x, ny-dirRef.y);
  if(d<5) return;
  const ang=Math.atan2(ny-dirRef.y, nx-dirRef.x);
  if(dirRef.ang!=null){
    let da=ang-dirRef.ang; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
    const dtt=Math.max(0.008, clock-dirRef.t);
    // ★瞬間値に上限をかける。指を中央へ戻す動き（180度の方向転換）は瞬間的に
    //   100rad/秒相当になり、これを旋回と見なすと惰性が即座に殺される。
    //   上限をかけて「continuously 曲がっている時だけ」制動がかかるようにする
    const inst=Math.min(12, Math.abs(da)/dtt);
    turnRate+=(inst-turnRate)*0.30;
  }
  dirRef.ang=ang; dirRef.x=nx; dirRef.y=ny; dirRef.t=clock;
}
const FLOW_K=0.50;        // 指の速度のうち、どれだけ世界を流すか（位置による分に上乗せ）
const FLOW_MIN=230;       // これ以下の速さでは流れない。輪を描く操作(毎秒150〜200px程度)で
                          // 流れてしまうと形が崩れるので、疾走と明確に分ける
// ★スクロールは「画面中央を過ぎたらすぐ」始まる。中央からの距離に比例して加速し、
//   端で最大。以前は「デッドゾーンの幅」と「加速の効き幅」が同じ変数だったため、
//   狭くするとスイッチのように全開になってしまい調整できなかった。式ごと分離した。
const CAM_DEAD=0.06;      // 中央のごく狭い不感帯（ここだけは流れない）
// ★端まで行った時の速さは「指で払う速さ」より速くないと、端に着いた瞬間に
//   減速して壁にぶつかったように感じる（＝走りを阻害される）。
//   立ち上がりも二次カーブだと手前が効かないので直線にする
const PAN_MAX=1300;       // 端まで押し付けた時の速さ(px/秒)
const PAN_CAP=1600;       // 流れる速さの上限(px/秒)
function followCam(dt){
  // ★ストローク開始の一瞬は流さない。向きが確定していない段階で流すと、
  //   実測で最初の0.067秒に72px流れ、その分だけ輪が敵からずれて空振りしていた
  if(dragging && (clock-strokeT0<0.13 || dirRef.ang==null)){
    prevFinger.x=finger.x; prevFinger.y=finger.y; return;
  }
  if(!dragging){ fingerVel.x=0; fingerVel.y=0; turnRate=0; straight=1; dirRef.ang=null;
    camVel.x=0; camVel.y=0;
    prevFinger.x=finger.x; prevFinger.y=finger.y; return; }
  const vx=(finger.x-prevFinger.x)/Math.max(0.001,dt), vy=(finger.y-prevFinger.y)/Math.max(0.001,dt);
  prevFinger.x=finger.x; prevFinger.y=finger.y;
  const sm=Math.min(1,dt*14);
  fingerVel.x+=(vx-fingerVel.x)*sm; fingerVel.y+=(vy-fingerVel.y)*sm;

  // 指が止まっている間は旋回の記憶を薄める（曲がり終えたら疾走に戻れる）
  if(clock-dirRef.t>0.12) turnRate+=(0-turnRate)*Math.min(1,dt*4);
  // ★「直進していると確認できるまで流さない」。触った瞬間や小さな操作では
  //   流れない＝囲みの取りこぼしが起きない。まっすぐ走り出した時だけ流れる。
  //   これが無いとストローク開始の一瞬で数十px流れ、輪が閉じなくなる
  // 曲がっている時だけ止める。速度で門をかけると端に押し付けて流せなくなる
  const st=1-Math.min(1,Math.max(0,(turnRate-TURN_LO)/(TURN_HI-TURN_LO)));
  // 曲がり始めは即座に止め、直進に戻る時はゆっくり戻す（囲みの取りこぼしを防ぐ）
  straight+=(st-straight)*Math.min(1, dt*(st<straight? 30:5));

  let cx=0, cy=0;
  const sp=Math.hypot(fingerVel.x,fingerVel.y);
  if(sp>FLOW_MIN){                    // 速く払った分だけ流す
    const g=(sp-FLOW_MIN)/sp*FLOW_K;
    cx+=fingerVel.x*g; cy+=fingerVel.y*g;
  }
  // 中央からの距離（-1〜1）に比例して流す。中央を少し過ぎた所から効き始める
  // ★中央付近でも速度が乗るよう、立ち上がりを強くする（t^0.7）。
  //   直線だと中央から93px押し出さないと毎秒600pxが出ず、走り出しの間ずっと
  //   指が端寄りになる＝指先より先の余白が狭い＝「先が見えない」。
  //   少し押しただけで速度が乗れば、指を中央近くに保ったまま走れる。
  const shape=v=>{
    const a=Math.abs(v);
    if(a<CAM_DEAD) return 0;
    const t=Math.min(1,(a-CAM_DEAD)/(1-CAM_DEAD));
    return (v<0?-1:1)*Math.pow(t,0.7);
  };
  cx+=shape((finger.x-W/2)/(W/2))*PAN_MAX;
  cy+=shape((finger.y-H/2)/(H/2))*PAN_MAX;

  cx*=straight; cy*=straight;        // 曲がっている間は流れない＝輪が閉じられる
  const tot=Math.hypot(cx,cy);
  if(tot>PAN_CAP){ cx=cx/tot*PAN_CAP; cy=cy/tot*PAN_CAP; }

  // 慣性：加速は速く、指を戻した後は惰性で流れ続け、曲がった時は素早く止まる
  const want=Math.hypot(cx,cy), now=Math.hypot(camVel.x,camVel.y);
  const acc = (straight<0.45) ? ACC_BRAKE : (want>now ? ACC_UP : ACC_COAST);
  const k=Math.min(1,dt*acc);
  camVel.x+=(cx-camVel.x)*k; camVel.y+=(cy-camVel.y)*k;
  cam.x+=camVel.x*dt; cam.y+=camVel.y*dt;
  clampCam();
}
function inView(x,y,m){ m=m||60;
  return x>cam.x-m && x<cam.x+viewW()+m && y>cam.y-m && y<cam.y+viewH()+m; }
function rodCount(){ return Math.max(20, Math.round(RODS_REF*playArea()/REF_AREA)); }
function foeCount(){ return Math.max(5,  Math.round(FOES_REF*playArea()/REF_AREA)); }
const DOOM=4.5;               // 弾け飛んだ菌の餓死までの秒数
const DOOM_WARN=1.8;          // 残りこの秒数で点滅予告
// ★酸を出した桿菌は消耗する（自家中毒）。封じた匹数だけ鎖から抜けて使用不能になり、
//   この秒数で回復して再び拾える。-1 にすると永久死（盤面が減り続ける）
const SPENT=0;           // 消耗なし（0で無効）
// ★酸の帯（なぞりの軌跡）の寿命。尾から蒸発するので、大きく囲うには素早く回る必要がある。
//   ただし鎖が団子にならないよう「鎖の長さ＋余白」は age に関係なく必ず残す
const TRAIL_LIFE=9999;   // 蒸発させない（急かす圧は入れない）
// ★手の死角対策。指と手のひらは半径55〜64pxを覆うので、近くの腐敗菌には
//   「手の外側まではみ出す大きさ」の警告リングを出す。操作系は変えない
const DANGER_R=95;     // 警告に気付き始める距離
const HAND_R=64;       // この距離まで来たら手の下＝警告を最大にする
function warnLevel(d){ return Math.max(0, Math.min(1, (DANGER_R-d)/(DANGER_R-HAND_R))); }

let rods=[];   // {x,y,ang,joined,order,phase}
let foes=[];   // {x,y,r,phase,dead,dt(死にアニメ),spikes[]}
let bits=[];   // 溶けカス粒子
let seals=[];  // 封印フラッシュ {poly,life}
let shards=[]; // シャッターの破片フラッシュ
let best=+(localStorage.getItem('sealBest')||0);
let totalSealed=0;
let hitCd=0;   // 衝突クールダウン
let shake=0;   // 画面揺れ

function rnd(a,b){return a+Math.random()*(b-a);}

function scatter(){
  rods=[];
  const N=rodCount();
  for(let i=0;i<N;i++){
    rods.push({x:rnd(40,worldW()-40), y:rnd(PLAY_TOP,worldBot()), ang:Math.random()*Math.PI, joined:false, order:0, phase:Math.random()*6.28, vx:0,vy:0,vr:0, doom:0, spent:0, dead:false});
  }
  foes=[]; const F=foeCount(); for(let i=0;i<F;i++) spawnFoe();
  bits=[]; seals=[]; shards=[]; totalSealed=0; hitCd=0; shake=0;
  cam={x:0,y:0}; clampCam();
  updateHud();
}
function spawnFoe(){
  const spikes=[]; const n=9;
  for(let i=0;i<n;i++) spikes.push(0.75+Math.random()*0.5);
  foes.push({x:rnd(50,worldW()-50), y:rnd(PLAY_TOP+12,worldBot()-12), r:FOE_R*rnd(0.8,1.25), ang:Math.random()*Math.PI*2,
             phase:Math.random()*6.28, spin:rnd(-0.5,0.5), dead:false, dt:0, spikes});
}

// ---------------- 入力 ----------------
let dragging=false, path=[], orderSeq=0, joinedCount=0, head={x:0,y:0}, prevHead={x:0,y:0};
let sealCooldown=0;
let clock=0;   // 経過秒。軌跡の各点の生成時刻に使う
// 画面座標 → 世界座標（カメラ分を足す）。世界の外へは出られないよう挟む。
// 挟まないと、世界の端でカメラが止まった後も先頭だけが外へ走り、画面外に置き去りになる
function pos(e){const r=cv.getBoundingClientRect();
  finger.x=e.clientX-r.left; finger.y=e.clientY-r.top;   // カメラの流れに使う
  feedDir(finger.x, finger.y);                            // 旋回の検出
  const x=finger.x/zoom+cam.x, y=finger.y/zoom+cam.y;
  return{ x:Math.max(6, Math.min(worldW()-6, x)),
          y:Math.max(PLAY_TOP-6, Math.min(worldBot()+6, y)) };}

// ※オフセット操作（操作点を指より上に置く）は試したが却下。
//   ユーザー評「違和感があり、手が邪魔になっていた修正前よりミスが多発する」。
//   → 操作は指の直下（直接タッチ）に戻し、手の死角は"見せ方"だけで補う
function start(x,y){
  rods.forEach(r=>{r.joined=false;});
  dragging=true; path=[{x,y,t:clock}]; head={x,y}; prevHead={x,y};
  orderSeq=0; joinedCount=0; sealCooldown=0;
  // カメラは「向きが確定してから」流す。初動で流すと輪が敵からずれて空振りする
  straight=0; turnRate=0; strokeT0=clock; camVel.x=0; camVel.y=0;
  dirRef={x:finger.x, y:finger.y, ang:null, t:clock};
  ac(); catchNear(x,y);
}
function moveTo(x,y){
  if(!dragging) return;
  const last=path[path.length-1];
  if(Math.hypot(x-last.x,y-last.y)>3){ path.push({x,y,t:clock}); if(path.length>600)path.shift(); }
  head={x,y}; catchNear(x,y);
  if(sealCooldown<=0) checkClose();
}
function end(){ dragging=false; }
function catchNear(x,y){
  for(const r of rods){
    if(r.joined) continue;
    if(r.spent>0) continue;          // 消耗中は酸を出せない＝拾えない
    if(Math.hypot(r.x-x,r.y-y)<=CATCH_R){
      r.joined=true; r.order=orderSeq++; joinedCount++;
      r.doom=0; r.vx=0; r.vy=0; r.vr=0;   // 救出＝餓死タイマー解除
      r.follow=0.30; r.b=null;             // 吸い付く瞬間だけ滑り込む／軌跡上の位置は初期化
      pop(joinedCount);
    }
  }
}

// --- 自己交差でループ検出 → 内側の腐敗菌を封じる ---
function segInt(p1,p2,p3,p4){
  const d1x=p2.x-p1.x,d1y=p2.y-p1.y, d2x=p4.x-p3.x,d2y=p4.y-p3.y;
  const den=d1x*d2y-d1y*d2x; if(Math.abs(den)<1e-6) return null;
  const t=((p3.x-p1.x)*d2y-(p3.y-p1.y)*d2x)/den;
  const u=((p3.x-p1.x)*d1y-(p3.y-p1.y)*d1x)/den;
  if(t>=0&&t<=1&&u>=0&&u<=1) return {x:p1.x+d1x*t, y:p1.y+d1y*t};
  return null;
}
function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y, xj=poly[j].x,yj=poly[j].y;
    if(((yi>py)!==(yj>py)) && (px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
// ★輪の成立は「自己交差」だけに頼らない。疾走しながら囲むと世界が流れるため
//   軌跡は螺旋になり、厳密な交差はまず起きない（実測：一度も閉じなかった）。
//   通ってきた線の近くまで戻ってきたら閉じる、という緩い判定を足す。
const CLOSE_R=38;
function checkClose(){
  const n=path.length; if(n<8) return;
  const a=path[n-2], b=path[n-1];      // 最新セグメント
  // 近づいたら閉じる（古い点＝大きく囲めた方を優先）
  for(let i=0;i<n-8;i++){
    if(Math.hypot(b.x-path[i].x, b.y-path[i].y)<CLOSE_R){
      const poly=[]; for(let k=i;k<n;k++) poly.push(path[k]);
      if(polyArea(poly)<1400) break;
      doSeal(poly);
      path=[{x:b.x,y:b.y,t:clock}];
      sealCooldown=0.2;
      return;
    }
  }
  for(let i=0;i<n-3;i++){
    const c=path[i], d=path[i+1];
    const X=segInt(a,b,c,d);
    if(X){
      // ループ多角形 = 交点 + path[i+1..n-1]
      const poly=[X]; for(let k=i+1;k<n;k++) poly.push(path[k]);
      const area=polyArea(poly);
      if(area<1400){ return; } // 小さすぎる自己交差は無視（ぶれ）
      doSeal(poly);
      // 使ったループぶんを刈る（残りは交点以降＝新たに囲い直せる）
      path=[{x:X.x,y:X.y,t:clock},{x:b.x,y:b.y,t:clock}];
      sealCooldown=0.18;
      return;
    }
  }
}
function polyArea(poly){
  let s=0; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ s+=(poly[j].x+poly[i].x)*(poly[j].y-poly[i].y); }
  return Math.abs(s/2);
}
function doSeal(poly){
  // ★囲った内側は全部溶ける。容量制も消耗も入れない ─ その場で結果が出ることが
  //   このゲームの分かりやすさの核だった（後から足した仕組みは全て遅延型で、
  //   「今の操作が正しかったのか」がその場で分からなくなっていた）
  let sealed=0;
  for(const f of foes){
    if(f.dead) continue;
    if(pointInPoly(f.x,f.y,poly)){
      f.dead=true; f.dt=0; sealed++;
      for(let i=0;i<12;i++) bits.push({x:f.x,y:f.y, vx:rnd(-1.3,1.3),vy:rnd(-1.7,0.4), life:1, r:rnd(1.5,3.6)});
    }
  }
  seals.push({poly, life:1, strong:joinedCount, partial:false});
  if(sealed>0){
    totalSealed+=sealed;
    if(totalSealed>best){ best=totalSealed; localStorage.setItem('sealBest',best); }
    updateHud();
    fizz(sealed, joinedCount);
    for(let i=0;i<sealed;i++) setTimeout(spawnFoe, 600+i*130);
    if(sealed>=3) tipMsg(sealed+'匹まとめて溶かした！');
  }else{
    fizz(0, joinedCount);
  }
}
function tipMsg(t){ const e=document.getElementById('tip'); e.textContent=t; e.style.opacity=1; }
function updateHud(){ elCnt.textContent=totalSealed; elBest.textContent= best? 'これまで最多 '+best : ''; }

// --- 鎖が腐敗菌に触れたら四散（両側リスク）---
// ★当たりの範囲を選べる。既定は「指先だけが危険」。
//   尻尾まで危険だと、狭い画面では"後ろで勝手にぶつかる"が起きて避けようがない。
//   指先だけなら「自分が突っ込んだ」と納得できる形で危険が残る。
//   ?hit=all で従来どおり鎖全体が危険になる
const HIT_MODE=(new URLSearchParams(location.search).get('hit')==='all')?'all':'head';
// ★桿菌は細長いので、当たりも円ではなくカプセル（線分からの距離）で取る。
//   円のままだと半径26pxになり「見た目では触れていないのに弾ける」が起きる
function foeDist(px,py,f){
  if(FOE_SHAPE!=='rod') return Math.hypot(px-f.x,py-f.y)-f.r*0.95;
  const sh=foeShape(f), ang=sh.ang, L=sh.L, Wd=sh.Wd;
  const ax=f.x-Math.cos(ang)*L/2, ay=f.y-Math.sin(ang)*L/2;
  const bx=f.x+Math.cos(ang)*L/2, by=f.y+Math.sin(ang)*L/2;
  const dx=bx-ax, dy=by-ay, LL=dx*dx+dy*dy;
  let t=LL? ((px-ax)*dx+(py-ay)*dy)/LL : 0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t))-Wd;
}
// ★1フレームの移動線分に沿って判定する。点だけで見ると、疾走中（1フレームに
//   40px以上進む）に敵を飛び越してしまう＝当たらない/当たりが運任せになる
function sweptHit(ax,ay,bx,by,f,HIT){
  const d=Math.hypot(bx-ax,by-ay);
  const n=Math.max(1, Math.ceil(d/6));
  for(let i=0;i<=n;i++){
    const t=i/n;
    if(foeDist(ax+(bx-ax)*t, ay+(by-ay)*t, f) < HIT) return true;
  }
  return false;
}
function checkHit(){
  if(hitCd>0) return;
  const HIT=RW/2+4;
  for(const f of foes){ if(f.dead) continue;
    if(sweptHit(prevHead.x,prevHead.y,head.x,head.y,f,HIT)){ shatter(f.x,f.y); return; } }
  if(HIT_MODE==='all'){
    for(const r of rods){ if(!r.joined) continue;
      for(const f of foes){ if(f.dead) continue;
        if(foeDist(r.x,r.y,f) < HIT){ shatter(f.x,f.y); return; } } }
  }
}
function shatter(ox,oy){
  const joined=rods.filter(r=>r.joined);
  if(joined.length===0){ // 空の鎖でも軽い弾き
    hitCd=0.25; shake=Math.max(shake,4); breakSnd(0); return; }
  for(const r of joined){
    r.joined=false; r.order=0;
    // 衝突点から放射状に、大きくばらけて飛ばす（回収に手間をかける）
    const a=Math.atan2(r.y-oy,r.x-ox)+rnd(-1.0,1.0);
    const sp=rnd(11,24);            // 初速アップ＝遠くまで飛ぶ
    r.vx=Math.cos(a)*sp; r.vy=Math.sin(a)*sp; r.vr=rnd(-0.6,0.6);
    r.doom=DOOM;                    // 餓死タイマー開始（拾えば救出）
  }
  shards.push({x:ox,y:oy,life:1});
  joinedCount=0; orderSeq=0;
  hitCd=0.45; shake=Math.max(shake, 6+Math.min(joined.length,12));
  breakSnd(joined.length);
  tipMsg('雑菌に触れると鎖が弾ける！ 触れずに囲め');
}

// ---- 酸の帯を尾から蒸発させる ----
// 古い点を先頭から捨てる。ただし鎖が追従に使う長さ分は age を無視して残す（団子防止）
function trimTrail(){
  if(path.length<3) return;
  // 伸びている分（r.b が ideal を超えた分）も残さないと、伸びた尻尾が軌跡の端で団子になる
  let maxB=0;
  for(const r of rods) if(r.joined && r.b>maxB) maxB=r.b;
  const need=Math.max(joinedCount*SPACING, maxB)+24;
  let keep=0, acc=0;
  for(let i=path.length-1;i>0;i--){
    acc+=Math.hypot(path[i].x-path[i-1].x, path[i].y-path[i-1].y);
    if(acc>=need){ keep=i-1; break; }
  }
  while(path.length>2 && keep>0 && (clock-path[0].t)>TRAIL_LIFE){ path.shift(); keep--; }
}

// ---- 鎖の目標位置 ----
function pointBack(d){
  let acc=0;
  for(let i=path.length-1;i>0;i--){
    const a=path[i], b=path[i-1];
    const seg=Math.hypot(a.x-b.x,a.y-b.y);
    if(acc+seg>=d){ const t=(d-acc)/Math.max(0.001,seg);
      return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t, ang:Math.atan2(a.y-b.y,a.x-b.x)}; }
    acc+=seg;
  }
  // 鎖が軌跡より長い場合は軌跡の末端に溜まる。角度0（真横）だと不自然なので
  // 末端セグメントの向きを返す
  const p=path[0]||head, q=path[1]||head;
  return {x:p.x, y:p.y, ang:Math.atan2(q.y-p.y, q.x-p.x)};
}

// ---- Web Audio ----
let A=null; function ac(){ if(!A){ try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(A&&A.state==='suspended')A.resume(); }
function pop(n){ if(!A)return; try{
  const t=A.currentTime, o=A.createOscillator(), gg=A.createGain();
  const base=520+Math.min(n,40)*26;
  o.type='sine'; o.frequency.setValueAtTime(base,t); o.frequency.exponentialRampToValueAtTime(base*1.5,t+0.05);
  gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(0.18,t+0.008); gg.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(gg).connect(A.destination); o.start(t); o.stop(t+0.16);
}catch(e){} }
function fizz(count,strong){ if(!A)return; try{
  const t=A.currentTime;
  // シュワッ＝ノイズのバースト
  const dur=0.28+Math.min(count,8)*0.02;
  const buf=A.createBuffer(1,Math.ceil(A.sampleRate*dur),A.sampleRate);
  const ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++){ const e=1-i/ch.length; ch[i]=(Math.random()*2-1)*e*e; }
  const src=A.createBufferSource(); src.buffer=buf;
  const bp=A.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(1800,t); bp.frequency.exponentialRampToValueAtTime(600,t+dur); bp.Q.value=0.8;
  const gg=A.createGain(); gg.gain.setValueAtTime(count?0.28:0.08,t); gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp).connect(gg).connect(A.destination); src.start(t); src.stop(t+dur);
  // 封印成立の和音（封じた数だけ上へ）
  if(count>0){
    const chord=520+Math.min(strong,40)*20;
    [0,4,7].slice(0,1+Math.min(count,2)).forEach((iv,k)=>{
      const o=A.createOscillator(), og=A.createGain();
      o.type='triangle'; o.frequency.value=chord*Math.pow(2,iv/12);
      og.gain.setValueAtTime(0.0001,t+k*0.03); og.gain.exponentialRampToValueAtTime(0.12,t+0.02+k*0.03); og.gain.exponentialRampToValueAtTime(0.0001,t+0.3+k*0.03);
      o.connect(og).connect(A.destination); o.start(t+k*0.03); o.stop(t+0.34+k*0.03);
    });
  }
}catch(e){} }

// 酸が足りず耐えられた時の"にごった"音
function resistSnd(n){ if(!A)return; try{
  const t=A.currentTime, dur=0.26;
  const o=A.createOscillator(), og=A.createGain();
  o.type='square'; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(96,t+dur);
  const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
  og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.05+Math.min(n,6)*0.012,t+0.02);
  og.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(lp).connect(og).connect(A.destination); o.start(t); o.stop(t+dur+0.02);
}catch(e){} }

function breakSnd(n){ if(!A)return; try{
  const t=A.currentTime, dur=0.22;
  // ザッと砕ける低め破裂ノイズ
  const buf=A.createBuffer(1,Math.ceil(A.sampleRate*dur),A.sampleRate);
  const ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++){ const e=1-i/ch.length; ch[i]=(Math.random()*2-1)*e; }
  const src=A.createBufferSource(); src.buffer=buf;
  const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(2200,t); lp.frequency.exponentialRampToValueAtTime(300,t+dur);
  const gg=A.createGain(); gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(0.05+Math.min(n,14)*0.02,t+0.01); gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(lp).connect(gg).connect(A.destination); src.start(t); src.stop(t+dur);
  // 下降のダウナー音
  if(n>0){ const o=A.createOscillator(), og=A.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(120,t+0.2);
    og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.10,t+0.01); og.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    o.connect(og).connect(A.destination); o.start(t); o.stop(t+0.24); }
}catch(e){} }

// ---- 描画 ----
let tms=0;
function drawRod(x,y,ang,joined,alpha,weak){
  alpha=alpha==null?1:alpha;
  g.save(); g.translate(x,y); g.rotate(ang); g.globalAlpha=alpha;
  if(joined){ g.shadowColor='rgba(140,240,200,.9)'; g.shadowBlur=10; }
  // weak=餓死しかけ＝退色（乳白→くすんだ灰）
  g.fillStyle=joined? '#c8ffe6' : (weak? '#9aa0a0' : '#dfeef0');
  g.strokeStyle=joined? 'rgba(120,235,190,.9)':'rgba(120,150,160,.5)'; g.lineWidth=1;
  if(PLAYER_SHAPE==='cocci'){
    // 球菌：1個ずつ数えられる数珠つなぎになる
    const R=RW*(joined?0.92:1.02);
    g.beginPath(); g.arc(0,0,R,0,7); g.fill(); g.stroke();
    if(!joined){ g.beginPath(); g.arc(0,0,R+1.6,0,7);
      g.strokeStyle='rgba(150,190,200,.5)'; g.lineWidth=1.2; g.stroke(); }
    g.beginPath(); g.arc(-R*0.28,-R*0.28,R*0.34,0,7);
    g.fillStyle='rgba(255,255,255,.3)'; g.fill();
  }else{
    const h=RLEN/2, r=RW/2;
    g.beginPath(); g.arc(-h,0,r,Math.PI/2,Math.PI*1.5); g.arc(h,0,r,-Math.PI/2,Math.PI/2); g.closePath();
    g.fill(); g.stroke();
  }
  g.restore(); g.globalAlpha=1;
}
// 敵＝ブドウ球菌。球が房状に固まった塊。鞭毛は無い＝生々しさが出ない
function foeClump(f){
  if(!f.clump){
    const n=5+Math.floor(Math.random()*3);
    const a=[{dx:0,dy:0,s:1}];
    for(let i=1;i<n;i++){
      const t=i/(n-1)*Math.PI*2+Math.random()*0.5;
      const d=f.r*rnd(0.46,0.66);
      a.push({dx:Math.cos(t)*d, dy:Math.sin(t)*d, s:rnd(0.72,0.95)});
    }
    f.clump=a;
  }
  return f.clump;
}
function drawFoeCocci(f,warn){
  const k=f.dead? Math.max(0,1-f.dt*3):1;
  if(k>0){
    const rs=f.resist||0;
    g.save(); g.translate(f.x,f.y); g.rotate((f.ang||0)+f.phase*0.12); g.globalAlpha=k;
    const R=f.r*0.52*k;
    if(!f.dead){ g.shadowColor='rgba(190,70,120,.45)'; g.shadowBlur=7; }
    for(const c of foeClump(f)){
      g.beginPath(); g.arc(c.dx*k, c.dy*k, R*c.s, 0, 7);
      g.fillStyle= f.dead? 'rgba(160,96,70,'+k+')'
        : (rs>0? 'rgba('+Math.round(150+90*rs)+',66,92,.96)':'rgba(168,80,118,.95)');
      g.strokeStyle= f.dead? 'rgba(200,140,120,.5)':'rgba(226,138,178,.75)';
      g.lineWidth=1; g.fill(); g.stroke();
    }
    g.shadowBlur=0;
    if(!f.dead){   // 房らしいハイライト
      for(const c of foeClump(f)){
        g.beginPath(); g.arc(c.dx*k-R*c.s*0.3, c.dy*k-R*c.s*0.3, R*c.s*0.3, 0, 7);
        g.fillStyle='rgba(255,215,235,.22)'; g.fill();
      }
    }
    g.restore(); g.globalAlpha=1;
  }
  if(warn>0 && !f.dead){
    const pulse=0.72+0.28*Math.sin(clock*9);
    g.save(); g.translate(f.x,f.y);
    g.beginPath(); g.arc(0,0,f.r+20+48*warn,0,7);
    g.strokeStyle='rgba(255,150,110,'+(0.95*warn*pulse)+')'; g.lineWidth=2.5+3*warn; g.stroke();
    g.restore();
  }
}
// 敵＝桿菌の形は1箇所で決める（描画と当たり判定がずれないように）。
// 縦横比は約2.9:1＝実際の桿菌らしい細さ。太いと棒に見えず、脇を抜ける余地も消える
function foeShape(f){
  // ★向きは固定。回転させると「避けたはずの菌が向きを変えて当たる」が起きて
  //   避けようがなくなる。生き物らしさは微揺れ(±0.1rad=先端で約2px)だけで出す
  const base=(f.ang==null? 0 : f.ang);
  return { ang: base + Math.sin(f.phase*0.8)*0.10,
           L:f.r*2.4, Wd:f.r*0.42 };
}
// 敵＝桿菌。鞭毛で泳ぐ姿にして、味方の球菌と一目で区別できるようにする
function drawFoeRod(f,warn){
  const k=f.dead? Math.max(0,1-f.dt*3):1;
  if(k>0){
    const sh=foeShape(f);
    g.save(); g.translate(f.x,f.y); g.rotate(sh.ang); g.globalAlpha=k;
    const rs=f.resist||0;
    const L=sh.L*k, Wd=sh.Wd*k;
    if(!f.dead){   // 鞭毛
      g.beginPath(); g.moveTo(-L/2,0);
      for(let i=1;i<=6;i++){ const t=i/6;
        g.lineTo(-L/2-t*L*0.85, Math.sin(f.phase*6+t*5.5)*3.4*t); }
      g.strokeStyle='rgba(214,140,178,.62)'; g.lineWidth=1.3; g.stroke();
    }
    g.beginPath();
    g.arc(-L/2,0,Wd,Math.PI/2,Math.PI*1.5); g.arc(L/2,0,Wd,-Math.PI/2,Math.PI/2); g.closePath();
    g.fillStyle= f.dead? 'rgba(160,96,70,'+k+')'
      : (rs>0? 'rgba('+Math.round(150+90*rs)+',66,92,.96)':'rgba(168,80,118,.95)');
    g.strokeStyle= f.dead? 'rgba(200,140,120,.5)':'rgba(226,138,178,.8)';
    if(!f.dead){ g.shadowColor='rgba(190,70,120,.45)'; g.shadowBlur=6; }
    g.lineWidth=1; g.fill(); g.stroke(); g.shadowBlur=0;
    if(!f.dead){   // 核様体
      g.beginPath(); g.ellipse(0,0,L*0.26,Wd*0.45,0,0,7);
      g.fillStyle='rgba(92,36,62,.75)'; g.fill();
    }
    g.restore(); g.globalAlpha=1;
  }
  if(warn>0 && !f.dead){   // 手の死角対策の警告リング
    const pulse=0.72+0.28*Math.sin(clock*9);
    g.save(); g.translate(f.x,f.y);
    g.beginPath(); g.arc(0,0,f.r+20+48*warn,0,7);
    g.strokeStyle='rgba(255,150,110,'+(0.95*warn*pulse)+')'; g.lineWidth=2.5+3*warn; g.stroke();
    g.restore();
  }
}
function drawFoe(f,warn){
  if(FOE_SHAPE==='cocci'){ drawFoeCocci(f,warn); return; }
  if(FOE_SHAPE==='rod'){ drawFoeRod(f,warn); return; }
  g.save(); g.translate(f.x,f.y); g.rotate(f.phase*0.3);
  const scale = f.dead ? Math.max(0,1-f.dt*3) : 1;
  const alpha = f.dead ? Math.max(0,1-f.dt*3) : 1;
  g.globalAlpha=alpha;
  const R=f.r*scale;
  // もやっとした胞子塊（トゲ付き）
  g.beginPath();
  const n=f.spikes.length;
  for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2; const rr=R*f.spikes[i%n]*(1+Math.sin(f.phase+i)*0.06);
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr; i?g.lineTo(x,y):g.moveTo(x,y); }
  g.closePath();
  const rs=f.resist||0;   // 酸に耐えた直後＝赤熱
  g.fillStyle= f.dead? 'rgba(150,90,60,'+alpha+')'
             : (rs>0? 'rgba('+(120+110*rs)+','+(74-20*rs)+','+(96-30*rs)+',.95)' : 'rgba(120,74,96,.92)');
  g.shadowColor= rs>0? 'rgba(255,90,70,'+(0.8*rs)+')' : 'rgba(60,20,40,.6)';
  g.shadowBlur= rs>0? 8+16*rs : 8; g.fill(); g.shadowBlur=0;
  // 核
  g.beginPath(); g.arc(0,0,R*0.42,0,7); g.fillStyle='rgba(60,30,44,.9)'; g.fill();
  // ★手の死角対策：近いほど大きく広がる警告リング。
  //   半径が手の遮蔽（55〜64px）を超えるので、指の下に隠れていても弧が外に見える
  if(warn>0 && !f.dead){
    const pulse=0.72+0.28*Math.sin(clock*9);
    g.beginPath(); g.arc(0,0,f.r+20+48*warn,0,7);
    g.strokeStyle='rgba(255,150,110,'+(0.95*warn*pulse)+')'; g.lineWidth=2.5+3*warn; g.stroke();
    g.beginPath(); g.arc(0,0,f.r+10,0,7);
    g.strokeStyle='rgba(255,190,150,'+(0.85*warn)+')'; g.lineWidth=2.5; g.stroke();
  }
  // 生きている腐敗菌の輪郭を少し外に出して見つけやすくする
  if(!f.dead){
    g.beginPath(); g.arc(0,0,R+5,0,7);
    g.strokeStyle='rgba(190,120,150,.30)'; g.lineWidth=1.5; g.stroke();
  }
  // 耐えたリング（外へ弾き返す）
  if(rs>0){
    g.beginPath(); g.arc(0,0,R+4+(1-rs)*10,0,7);
    g.strokeStyle='rgba(255,110,90,'+(0.75*rs)+')'; g.lineWidth=2+2*rs; g.stroke();
  }
  g.restore(); g.globalAlpha=1;
}
function loop(ts){
  const dt=Math.min(0.05,(tms?ts-tms:16)/1000); tms=ts;
  clock+=dt;
  if(sealCooldown>0) sealCooldown-=dt;
  if(hitCd>0) hitCd-=dt;
  followCam(dt); updateZoom(dt);
  if(dragging){
    // ★指を止めたままでもカメラは流れる。先頭は毎フレーム「指の画面位置＋カメラ」で
    //   引き直す。これが無いと先頭だけ世界に取り残されて画面外へ消える
    moveTo(Math.max(6, Math.min(worldW()-6, finger.x/zoom+cam.x)),
           Math.max(PLAY_TOP-6, Math.min(worldBot()+6, finger.y/zoom+cam.y)));
    trimTrail(); checkHit();
  }


  g.save();
  if(shake>0.2){ const s=shake; g.translate(rnd(-s,s),rnd(-s,s)); shake*=0.86; } else shake=0;

  g.clearRect(-20,-20,W+40,H+40);
  const bg=g.createRadialGradient(W/2,H*0.45,60,W/2,H*0.45,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#12202a'); bg.addColorStop(1,'#0b0f14'); g.fillStyle=bg; g.fillRect(-20,-20,W+40,H+40);

  g.scale(zoom,zoom); g.translate(-cam.x,-cam.y);   // ここから世界座標（ズーム込み）
  // 世界の縁（どこまで行けるか分かるように薄く）
  g.strokeStyle='rgba(120,200,180,.10)'; g.lineWidth=2;
  g.strokeRect(0,PLAY_TOP,worldW(),worldBot()-PLAY_TOP);

  // 腐敗菌
  for(const f of foes){ f.phase+=dt*(1+f.spin); if(f.dead) f.dt+=dt;
    if(!inView(f.x,f.y)) continue;
    if(f.resist>0){ f.resist-=dt*1.4; if(f.resist<0) f.resist=0; }
    const warn=0;   // 近づくと出ていた赤い輪は邪魔なので廃止
    drawFoe(f,warn); }
  foes=foes.filter(f=>!(f.dead&&f.dt>0.5));

  // 封印フラッシュ
  for(const s of seals){
    s.life-=dt*2.2;
    if(s.life>0){
      g.beginPath(); g.moveTo(s.poly[0].x,s.poly[0].y);
      for(let i=1;i<s.poly.length;i++) g.lineTo(s.poly[i].x,s.poly[i].y); g.closePath();
      // 容量不足の封印は琥珀色＝「足りなかった」が一目で分かる
      if(s.partial){
        g.fillStyle='rgba(245,200,120,'+(0.26*s.life)+')';
        g.strokeStyle='rgba(255,215,140,'+(0.7*s.life)+')';
      }else{
        g.fillStyle='rgba(150,245,205,'+(0.30*s.life)+')';
        g.strokeStyle='rgba(180,255,220,'+(0.7*s.life)+')';
      }
      g.lineWidth=3; g.fill(); g.stroke();
    }
  }
  seals=seals.filter(s=>s.life>0);

  // 溶けカス
  for(const b of bits){ b.x+=b.vx; b.y+=b.vy; b.vy+=0.06; b.life-=dt*1.6;
    if(b.life>0){ g.beginPath(); g.arc(b.x,b.y,b.r*b.life,0,7); g.fillStyle='rgba(160,245,200,'+(0.7*b.life)+')'; g.fill(); } }
  bits=bits.filter(b=>b.life>0);

  // 鎖の目標（順序のみ。位置は下でバネ計算する）
  const joined=rods.filter(r=>r.joined).sort((a,b)=>a.order-b.order);
  const headAdv=dragging? Math.hypot(head.x-prevHead.x, head.y-prevHead.y) : 0;

  // 現在のなぞり線（酸の帯）＝古い所ほど薄く細く＝蒸発しかけ
  if(dragging && path.length>1){
    // セグメント単位で太さを変えると丸キャップが数珠状に見えるので、
    // 経年でバンド分けして「バンド内は連続した1本」として描く
    g.lineCap='round'; g.lineJoin='round';
    g.shadowColor='rgba(140,240,200,.5)'; g.shadowBlur=10;
    const BANDS=12, n=path.length;   // 多いほど太さの段差＝継ぎ目のコブが目立たない
    for(let b=0;b<BANDS;b++){
      const i0=Math.floor((n-1)*b/BANDS), i1=Math.floor((n-1)*(b+1)/BANDS);
      if(i1<=i0) continue;
      const mid=path[Math.floor((i0+i1)/2)];
      const f=Math.max(0,Math.min(1,1-(clock-mid.t)/TRAIL_LIFE));  // 1=出来たて 0=蒸発直前
      g.beginPath(); g.moveTo(path[i0].x,path[i0].y);
      for(let i=i0+1;i<=i1;i++) g.lineTo(path[i].x,path[i].y);
      if(b===BANDS-1) g.lineTo(head.x,head.y);
      // 丸キャップは始点で前のバンドに乗り出してコブになる。先端のみ丸、継ぎ目はバット
      g.lineCap= b===BANDS-1? 'round':'butt';
      g.strokeStyle='rgba(140,240,200,'+(0.05+0.27*f)+')';
      g.lineWidth=(RW+4)*(0.42+0.58*f);
      g.stroke();
    }
    g.shadowBlur=0;
  }

  // シャッターの破片フラッシュ（弾けた地点の輪）
  for(const s of shards){ s.life-=dt*2.6;
    if(s.life>0){ g.beginPath(); g.arc(s.x,s.y,(1-s.life)*70+8,0,7);
      g.strokeStyle='rgba(255,150,120,'+(0.6*s.life)+')'; g.lineWidth=3+6*s.life; g.stroke(); } }
  shards=shards.filter(s=>s.life>0);

  // 浮遊中の味方
  for(const r of rods){ if(r.joined) continue;
    if(!inView(r.x,r.y) && !(r.vx||r.vy) && !(r.doom>0)) continue;
    // 弾け飛んだ勢い（あれば）を減衰させながら適用
    if(r.vx||r.vy){ r.x+=r.vx; r.y+=r.vy; r.ang+=r.vr; r.vx*=0.93; r.vy*=0.93; r.vr*=0.93;
      if(r.x<24){r.x=24;r.vx*=-0.5;} if(r.x>worldW()-24){r.x=worldW()-24;r.vx*=-0.5;}
      if(r.y<PLAY_TOP-20){r.y=PLAY_TOP-20;r.vy*=-0.5;} if(r.y>worldBot()+20){r.y=worldBot()+20;r.vy*=-0.5;}
      if(Math.abs(r.vx)<0.05&&Math.abs(r.vy)<0.05){r.vx=0;r.vy=0;r.vr=0;} }
    r.phase+=dt*1.5; const wob=Math.sin(r.phase)*0.06;
    // ★消耗中（酸を出し切った）＝くすんで拾えない。回復したら元に戻る
    let alpha=1, weak=false;
    if(r.spent>0){
      r.spent-=dt; if(r.spent<0) r.spent=0;
      if(r.spent>0){ weak=true; alpha=0.32+0.10*Math.sin(r.phase*3); }
    }
    if(dragging && r.spent<=0){ const d=Math.hypot(r.x-head.x,r.y-head.y);
      if(d<CATCH_R*2.2){ const a=Math.atan2(head.y-r.y,head.x-r.x);
        let da=a-r.ang; while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
        r.ang+= da*(1-d/(CATCH_R*2.2))*0.12; } }
    // 餓死タイマー（弾け飛んだ菌のみ）：色はそのまま、点滅で"要救出"を示す。死が近いほど点滅が速い
    if(r.doom>0){
      r.doom-=dt;
      if(r.doom<=0){ // 餓死：小さな消滅パフを残して除去
        r.dead=true;
        for(let i=0;i<6;i++) bits.push({x:r.x,y:r.y, vx:rnd(-0.6,0.6),vy:rnd(-0.9,0.2), life:1, r:rnd(1,2.4)});
        continue;
      }
      const frac=r.doom/DOOM;                 // 1=弾けた直後 → 0=死の直前
      const rate=6+(1-frac)*46;               // 点滅の速さ（rad/s）：残り少ないほど速く
      r.blink=(r.blink||0)+dt*rate;
      alpha=0.30+0.70*(0.5+0.5*Math.sin(r.blink)); // 0.30〜1.0 で明滅（元の色のまま）
    }
    drawRod(r.x,r.y,r.ang+wob,false,alpha,weak);
  }
  rods=rods.filter(r=>!r.dead);
  // つながった味方
  for(let k=0;k<joined.length;k++){
    const r=joined[k];
    // ★遅れは「xy座標」ではなく「軌跡上をどれだけ後退しているか(=r.b)」に掛ける。
    //   xyに掛けると急カーブで内側をショートカットし、指が避けた敵に鎖だけが当たる
    //   （実測で最大26pxのズレ＝理不尽な四散）。距離に掛ければ桿菌は常に軌跡の上に
    //   居たまま、伸び縮みだけが残る＝線路を外さない電車やヘビと同じ動き。
    const ideal=(joined.length-1-k+1)*SPACING;
    if(r.b==null) r.b=ideal;
    r.b+=headAdv;                    // 頭が進んだ分だけ相対的に後ろへ置いていかれる
    r.b+=(ideal-r.b)*0.30;           // バネで追いつく＝加速で伸び、止まると縮む
    if(r.b>ideal+70) r.b=ideal+70;   // 伸びすぎると指から千切れて見えるので上限
    const tp=pointBack(r.b);
    r.follow=Math.min(1,(r.follow==null?1:r.follow)+dt*3.5);
    r.x+=(tp.x-r.x)*r.follow; r.y+=(tp.y-r.y)*r.follow;
    // ★角度も軌跡に揃える。遅れを残すとカーブ中に全桿菌が同じだけ傾いて
    //   曲線を横切る平行な斜め棒「//////」に見える（実測：接線から平均23度・最大82度）。
    //   接線は前後14pxで取って滑らかにする（3px間隔の生セグメントだとガタつく）
    const pf=pointBack(Math.max(0,r.b-7)), pb=pointBack(r.b+7);
    const tdx=pf.x-pb.x, tdy=pf.y-pb.y;
    r.ang = (Math.abs(tdx)+Math.abs(tdy) > 0.5) ? Math.atan2(tdy,tdx) : tp.ang;
    drawRod(r.x,r.y,r.ang,true);
  }

  if(dragging){ g.beginPath(); g.arc(head.x,head.y,7,0,7);
    g.fillStyle='rgba(200,255,230,.9)'; g.shadowColor='#8ff0c0'; g.shadowBlur=16; g.fill(); g.shadowBlur=0;
    // ★今の鎖本数＝一度に溶かせる匹数。閉じる前に足りるか判断させる
    // 鎖に埋もれないよう、暗いバッジを敷いて指先の上に浮かせる
    // ★指は物理的に8〜10mm＝55〜64px を覆う。30pxでは指の下に隠れるので離す。
    //   画面上端に近い時は指の下側に回す
    const br=17;
    const bx=Math.max(cam.x+br/zoom+4, Math.min(cam.x+viewW()-br/zoom-4, head.x));
    const by=(head.y-56 < cam.y+(br+50)/zoom)? head.y+56 : head.y-56;
    g.save();
    g.beginPath(); g.arc(bx,by,br,0,7);
    g.fillStyle='rgba(6,14,12,.82)'; g.fill();
    g.strokeStyle= joinedCount? 'rgba(140,250,200,.95)' : 'rgba(255,140,110,.95)';
    g.lineWidth=2; g.stroke();
    g.font='800 18px system-ui,-apple-system,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillStyle= joinedCount? '#a6ffd4' : '#ff9a80';
    g.fillText(joinedCount, bx, by+1);
    g.restore(); g.shadowBlur=0;
  }

  g.restore(); // 世界座標ここまで＋画面揺れ

  // ミニマップ：広い世界のどこに何が居るかを把握するための最小限の表示
  if(WORLD>1 && _q.get('map')!=='0'){
    const mw=70, mh=Math.round(mw*(worldBot()-PLAY_TOP)/worldW()), mx=10, my=100;
    g.save();
    g.fillStyle='rgba(10,16,20,.55)'; g.strokeStyle='rgba(140,240,200,.22)'; g.lineWidth=1;
    g.beginPath(); g.rect(mx,my,mw,mh); g.fill(); g.stroke();
    const sx=mw/worldW(), sy=mh/(worldBot()-PLAY_TOP);
    for(const f of foes){ if(f.dead) continue;
      g.beginPath(); g.arc(mx+f.x*sx, my+(f.y-PLAY_TOP)*sy, 1.6, 0, 7);
      g.fillStyle='rgba(226,138,178,.9)'; g.fill(); }
    // 今なぞっている線
    if(dragging && path.length>1){
      g.beginPath(); g.moveTo(mx+path[0].x*sx, my+(path[0].y-PLAY_TOP)*sy);
      for(let i=1;i<path.length;i++) g.lineTo(mx+path[i].x*sx, my+(path[i].y-PLAY_TOP)*sy);
      g.strokeStyle='rgba(160,255,215,.85)'; g.lineWidth=1.2; g.stroke();
      g.beginPath(); g.arc(mx+head.x*sx, my+(head.y-PLAY_TOP)*sy, 2.2, 0, 7);
      g.fillStyle='#c8ffe6'; g.fill();
    }
    // 今見えている範囲
    g.strokeStyle='rgba(200,255,230,.4)'; g.lineWidth=1;
    g.strokeRect(mx+cam.x*sx, my+Math.max(0,cam.y-PLAY_TOP)*sy, viewW()*sx, Math.min(mh, viewH()*sy));
    g.restore();
  }
  prevHead.x=head.x; prevHead.y=head.y;
  requestAnimationFrame(loop);
}
resize(); scatter(); requestAnimationFrame(loop);
window.__dbg={foes:()=>foes,rods:()=>rods,joined:()=>joinedCount,seals:()=>seals,path:()=>path,hitMode:()=>HIT_MODE,
  head:()=>head, cam:()=>cam, zoom:()=>zoom, straight:()=>straight, turn:()=>turnRate, camVel:()=>camVel, world:()=>({w:worldW(),top:PLAY_TOP,bot:worldBot(),k:WORLD}),
  bounds:()=>({top:PLAY_TOP,bot:playBot()})};
</script>
</body>
</html>
