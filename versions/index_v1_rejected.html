<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>プロバイオティＸ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0c0a10;
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:#eee;
    touch-action:none;overscroll-behavior:none}
  #wrap{position:fixed;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100dvh;display:block}
  /* --- overlay (title / result) --- */
  #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:radial-gradient(120% 90% at 50% 40%,rgba(30,22,40,.72),rgba(8,6,12,.92));
    backdrop-filter:blur(2px);z-index:10}
  #ov[hidden]{display:none}
  .ttl{font-size:40px;font-weight:800;letter-spacing:.04em;margin-bottom:6px}
  .ttl b{color:#c8f36a}
  .sub{font-size:14px;color:#b7b1c4;margin-bottom:2px}
  .tag{font-size:15px;line-height:1.8;color:#d8d3e4;margin:14px 0 0;max-width:20em}
  .tag b{color:#c8f36a;font-weight:700}
  .btnrow{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;font-size:17px;font-weight:700;color:#12100a;background:#c8f36a;border:0;
    border-radius:999px;padding:13px 30px;cursor:pointer;box-shadow:0 6px 18px rgba(160,220,80,.25)}
  button.ghost{background:transparent;color:#d8d3e4;box-shadow:none;border:1.5px solid rgba(200,190,220,.4)}
  .big{font-size:56px;font-weight:800;color:#c8f36a;margin:2px 0}
  .lbl{font-size:13px;color:#a9a3b8;letter-spacing:.08em}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="ov">
    <div class="sub">発酵三部作 ＸＹＺ ／ 乳酸菌</div>
    <div class="ttl">プロバイオティ<b>Ｘ</b></div>
    <div class="tag">
      散らばった<b>乳酸菌</b>を 指で<b>つなぐ</b>。<br>
      離すと 鎖が<b>酸</b>を放ち、<br>
      フチから迫る<b>腐敗菌</b>を溶かして<br>
      漬物を <b>守り切れ</b>。
    </div>
    <div class="btnrow">
      <button id="start">はじめる</button>
    </div>
  </div>
</div>

<script>
'use strict';
const VERSION='v1';
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const ov=document.getElementById('ov');
let W=0,H=0,DPR=1, cx=0,cy=0, R=0; // R = food radius

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2; cy=H/2; R=Math.min(W,H)*0.30;
}
window.addEventListener('resize',resize);

// ---------- state ----------
const TIME=60;
let running=false, finished=false, runT=0;
let sugar=60;                 // 糖メーター (0..100) = 酸の弾
const SUGAR_MAX=100, SUGAR_REGEN=7, SUGAR_PER=6; // 菌1匹あたりの糖コスト
let acidity=0;                // 酸度 (0..100) 出しすぎると上がる
const ACID_RISE=5, ACID_FALL=4;
let integrity=1;             // 食材の無事さ (0..1)
let best=+(localStorage.getItem('probioticXBest')||0);

let bacteria=[];   // {x,y,cool} つなげる乳酸菌
let mold=[];        // {x,y,vx,vy,r,hp} フチから侵食する腐敗菌
let pulses=[];      // 酸の演出 {pts,life,str}
let spawnT=0, moldT=0;
const B_TARGET=16, B_COOL=1.4, CONNECT_R=30;

const chains=new Map(); // pointerId -> {nodes:[idx], px,py}

function reset(){
  running=true; finished=false; runT=0;
  sugar=60; acidity=0; integrity=1;
  bacteria=[]; mold=[]; pulses=[]; chains.clear();
  spawnT=0; moldT=0;
  for(let i=0;i<B_TARGET;i++) bacteria.push(newBact());
}
function rnd(a,b){return a+Math.random()*(b-a);}
function newBact(){
  const t=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*R*0.86;
  return {x:cx+Math.cos(t)*r, y:cy+Math.sin(t)*r, cool:0};
}
function spawnMold(){
  const t=Math.random()*Math.PI*2;
  const edge=R*1.75;                       // 食材のすぐ外から湧く＝すぐ戦いになる
  const x=cx+Math.cos(t)*edge, y=cy+Math.sin(t)*edge;
  const sp=rnd(16,26)*(1+runT/TIME*0.9);
  const d=Math.hypot(cx-x,cy-y);
  mold.push({x,y, vx:(cx-x)/d*sp, vy:(cy-y)/d*sp, r:rnd(11,17), hp:1});
}

// ---------- input ----------
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function tryAdd(ch,x,y){
  // 既にどの鎖にも入っていない・クールでない菌を射程内で拾う
  for(let i=0;i<bacteria.length;i++){
    const b=bacteria[i];
    if(b.cool>0 || b.inChain) continue;
    if(Math.hypot(b.x-x,b.y-y)<=CONNECT_R){
      b.inChain=true; ch.nodes.push(i); return;
    }
  }
}
function down(id,x,y){
  if(!running||finished) return;
  const ch={nodes:[],px:x,py:y}; chains.set(id,ch); tryAdd(ch,x,y);
}
function move(id,x,y){
  const ch=chains.get(id); if(!ch) return;
  ch.px=x; ch.py=y; tryAdd(ch,x,y);
}
function up(id){
  const ch=chains.get(id); if(!ch) return;
  fire(ch); ch.nodes.forEach(i=>{if(bacteria[i])bacteria[i].inChain=false;});
  chains.delete(id);
}
function fire(ch){
  let n=ch.nodes.length;
  if(n<2) return; // 2匹未満はつながらない
  const afford=Math.min(n, Math.floor(sugar/SUGAR_PER));
  if(afford<2) return; // 糖不足でしぼむ
  const nodes=ch.nodes.slice(0,afford);
  sugar-=afford*SUGAR_PER;
  acidity=Math.min(100, acidity+afford*ACID_RISE);
  const pts=nodes.map(i=>({x:bacteria[i].x,y:bacteria[i].y}));
  const str=afford, rad=16+afford*4.2;
  // 腐敗菌にダメージ：鎖の各線分の近くを溶かす
  mold.forEach(m=>{
    let near=1e9;
    for(let i=0;i<pts.length-1;i++) near=Math.min(near,segDist(m.x,m.y,pts[i],pts[i+1]));
    if(pts.length===1) near=Math.hypot(m.x-pts[0].x,m.y-pts[0].y);
    if(near<rad+m.r) m.hp-=str*0.9;
  });
  nodes.forEach(i=>bacteria[i].cool=B_COOL);
  pulses.push({pts,life:1,str,rad});
}
function segDist(px,py,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
  let t=l2? ((px-a.x)*dx+(py-a.y)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(a.x+dx*t), py-(a.y+dy*t));
}

cv.addEventListener('mousedown',e=>{const p=pos(e);down('m',p.x,p.y);});
cv.addEventListener('mousemove',e=>{const p=pos(e);move('m',p.x,p.y);});
window.addEventListener('mouseup',()=>up('m'));
cv.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){const p=pos(t);down(t.identifier,p.x,p.y);}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){const p=pos(t);move(t.identifier,p.x,p.y);}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)up(t.identifier);},{passive:false});
cv.addEventListener('touchcancel',e=>{for(const t of e.changedTouches)up(t.identifier);});

// ---------- update ----------
function step(dt){
  runT+=dt;
  sugar=Math.min(SUGAR_MAX, sugar+SUGAR_REGEN*dt*(1-acidity/140));
  acidity=Math.max(0, acidity-ACID_FALL*dt);

  // 乳酸菌：クール回復＆補充（酸度が高いと補充が遅い）
  bacteria.forEach(b=>{ if(b.cool>0) b.cool=Math.max(0,b.cool-dt); });
  spawnT+=dt;
  const bInterval=0.5*(1+acidity/60);
  if(spawnT>bInterval && bacteria.length<B_TARGET){ spawnT=0; bacteria.push(newBact()); }

  // 腐敗菌の湧き（後半ほど速い）
  moldT+=dt;
  const mInterval=Math.max(0.55, 1.7-runT/TIME*1.3);
  if(moldT>mInterval){ moldT=0; spawnMold(); }

  // 腐敗菌の移動・食材侵食
  let onFood=0;
  for(let i=mold.length-1;i>=0;i--){
    const m=mold[i];
    const d=Math.hypot(cx-m.x,cy-m.y);
    if(d>R*0.55){ m.x+=m.vx*dt; m.y+=m.vy*dt; }
    else { onFood++; m.r=Math.min(m.r+6*dt, 26); } // 食材に到達したら居座って広がる
    if(m.hp<=0){ mold.splice(i,1); }
  }
  integrity=Math.max(0, integrity - onFood*0.055*dt);

  // 酸の演出減衰
  for(let i=pulses.length-1;i>=0;i--){ pulses[i].life-=dt*2.6; if(pulses[i].life<=0) pulses.splice(i,1); }

  if(integrity<=0){ end(false); }
  else if(runT>=TIME){ end(true); }
}

function end(survived){
  finished=true; running=false;
  const score=Math.round( (survived?60:runT)/TIME*60 + integrity*40 );
  if(score>best){ best=score; localStorage.setItem('probioticXBest',best); }
  ov.hidden=false;
  ov.innerHTML =
    '<div class="sub">'+(survived?'守り切った！':'漬物が腐ってしまった…')+'</div>'+
    '<div class="lbl">SCORE</div><div class="big">'+score+'</div>'+
    '<div class="lbl">BEST '+best+'</div>'+
    '<div class="btnrow"><button id="start">もう一度</button></div>';
  document.getElementById('start').addEventListener('click',startGame);
}

// ---------- draw ----------
function draw(){
  g.clearRect(0,0,W,H);
  // 壺の底
  const bg=g.createRadialGradient(cx,cy,R*0.2,cx,cy,Math.max(W,H)*0.7);
  bg.addColorStop(0,'#241c2e'); bg.addColorStop(1,'#0c0a10');
  g.fillStyle=bg; g.fillRect(0,0,W,H);

  // 食材（漬物）— 無事さで色が変わる
  g.save();
  const q=integrity;
  const fg=g.createRadialGradient(cx-R*0.2,cy-R*0.2,R*0.1,cx,cy,R);
  fg.addColorStop(0, mix('#e7c46a','#5b4d3a',1-q));
  fg.addColorStop(1, mix('#b98f3e','#3a3026',1-q));
  g.fillStyle=fg;
  blob(cx,cy,R,7,runT*0.15); g.fill();
  g.restore();

  // 腐敗菌
  mold.forEach(m=>{
    g.save();
    const mg=g.createRadialGradient(m.x,m.y,1,m.x,m.y,m.r);
    mg.addColorStop(0,'rgba(120,140,90,.95)');
    mg.addColorStop(.6,'rgba(78,96,72,.9)');
    mg.addColorStop(1,'rgba(50,60,54,0)');
    g.fillStyle=mg; g.beginPath(); g.arc(m.x,m.y,m.r,0,7); g.fill();
    g.restore();
  });

  // 乳酸菌（つなげる点）
  bacteria.forEach(b=>{
    const cd=b.cool>0;
    g.beginPath(); g.arc(b.x,b.y,cd?3.5:5.5,0,7);
    g.fillStyle=cd?'rgba(150,170,180,.35)':'#eafcff';
    g.fill();
    if(!cd){ g.beginPath(); g.arc(b.x,b.y,9,0,7);
      g.strokeStyle='rgba(150,240,255,.25)'; g.lineWidth=1.4; g.stroke(); }
  });

  // つなぎ中の鎖
  chains.forEach(ch=>{
    if(ch.nodes.length===0) return;
    g.beginPath();
    ch.nodes.forEach((i,k)=>{const b=bacteria[i]; k?g.lineTo(b.x,b.y):g.moveTo(b.x,b.y);});
    g.lineTo(ch.px,ch.py);
    g.strokeStyle='rgba(200,243,106,.9)'; g.lineWidth=3; g.lineCap='round'; g.lineJoin='round';
    g.shadowColor='#c8f36a'; g.shadowBlur=12; g.stroke(); g.shadowBlur=0;
    ch.nodes.forEach(i=>{const b=bacteria[i]; g.beginPath(); g.arc(b.x,b.y,6,0,7); g.fillStyle='#c8f36a'; g.fill();});
  });

  // 酸パルス
  pulses.forEach(p=>{
    g.save(); g.globalAlpha=Math.max(0,p.life);
    g.strokeStyle='#dfff8a'; g.lineWidth=2+p.str*0.5; g.lineCap='round'; g.lineJoin='round';
    g.shadowColor='#c8f36a'; g.shadowBlur=18;
    g.beginPath(); p.pts.forEach((pt,k)=>k?g.lineTo(pt.x,pt.y):g.moveTo(pt.x,pt.y)); g.stroke();
    g.globalAlpha=Math.max(0,p.life)*0.4;
    p.pts.forEach(pt=>{g.beginPath(); g.arc(pt.x,pt.y,p.rad*(1.2-p.life),0,7); g.fillStyle='rgba(200,243,106,.25)'; g.fill();});
    g.restore();
  });

  // HUD
  drawHUD();
}
function blob(x,y,r,n,ph){
  g.beginPath();
  for(let i=0;i<=40;i++){ const a=i/40*Math.PI*2;
    const rr=r*(1+0.05*Math.sin(a*n+ph));
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    i?g.lineTo(px,py):g.moveTo(px,py); }
  g.closePath();
}
function drawHUD(){
  const pad=16, top=Math.max(20,H*0.035);
  // タイマー
  const left=Math.max(0,TIME-runT);
  g.textAlign='center'; g.textBaseline='top';
  g.fillStyle=left<=5?'#ff8a6a':'#eee';
  g.font='700 26px system-ui,-apple-system,sans-serif';
  g.fillText(Math.ceil(left), cx, top);

  // 糖バー（左）
  bar(pad, top+2, 100, 8, sugar/SUGAR_MAX, '#c8f36a', '糖');
  // 酸度バー（右）
  bar(W-pad-100, top+2, 100, 8, acidity/100, acidity>70?'#ff6a6a':'#e0a86a', '酸', true);
  // 無事さ（下部）
  bar(cx-70, H-40, 140, 9, integrity, mix('#8fd06a','#c85a4a',1-integrity)==='' ?'#8fd06a':mix('#8fd06a','#c85a4a',1-integrity), '漬物', false, true);
}
function bar(x,y,w,h,v,col,label,right,center){
  g.fillStyle='rgba(255,255,255,.12)'; rrect(x,y,w,h,h/2); g.fill();
  g.fillStyle=col; rrect(x,y,w*Math.max(0,Math.min(1,v)),h,h/2); g.fill();
  g.fillStyle='rgba(230,230,240,.75)'; g.font='600 11px system-ui'; g.textBaseline='bottom';
  g.textAlign=center?'center':(right?'right':'left');
  g.fillText(label, center?x+w/2:(right?x+w:x), y-2);
}
function rrect(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function mix(a,b,t){t=Math.max(0,Math.min(1,t));
  const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

// ---------- loop ----------
let last=0;
function loop(ts){
  const dt=Math.min(0.05,(last?ts-last:16)/1000); last=ts;
  if(running&&!finished) step(dt);
  draw();
  requestAnimationFrame(loop);
}

function startGame(){ ov.hidden=true; reset(); }
document.getElementById('start').addEventListener('click',startGame);

resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
