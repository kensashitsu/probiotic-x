<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>囲って増殖を抑える 実験</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0f14;
    font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;color:#eee;
    touch-action:none;overscroll-behavior:none}
  canvas{position:absolute;inset:0;width:100%;height:100dvh;display:block}
  #hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;text-align:center;
    pointer-events:none;z-index:5}
  #hud .row{font-size:13px;color:#bfe9d2;letter-spacing:.03em}
  #hud .row b{font-size:23px;color:#8ff0c0;font-weight:800}
  #hud .sm{font-size:11.5px;color:#7a8a86;margin-top:1px}
  #bar{position:absolute;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translateX(-50%);
    width:200px;height:6px;background:#22303a;border-radius:99px;overflow:hidden;z-index:5;pointer-events:none}
  #barIn{height:100%;width:0%;background:linear-gradient(90deg,#9c5f86,#e07aa8);transition:width .25s}
  .btn{position:absolute;top:calc(env(safe-area-inset-top) + 10px);
    font:inherit;font-size:12px;font-weight:700;color:#0b0f14;background:#8ff0c0;border:0;border-radius:999px;
    padding:7px 14px;z-index:6}
  #reset{right:12px}
  #tip{position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:0;right:0;text-align:center;
    font-size:12px;line-height:1.5;color:#6f7d84;padding:0 16px;z-index:5;pointer-events:none;transition:opacity .4s}
  #over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(8,12,16,.87);z-index:10;text-align:center;padding:20px}
  #over.on{display:flex}
  #over .t{font-size:22px;font-weight:800;color:#ff9a80;margin-bottom:6px}
  #over .s{font-size:14px;color:#bfe9d2;margin-bottom:20px;line-height:1.8}
  #over button{font:inherit;font-size:15px;font-weight:800;color:#0b0f14;background:#8ff0c0;border:0;
    border-radius:999px;padding:12px 26px}
  #ver{position:fixed;left:8px;bottom:5px;font-size:10px;letter-spacing:.02em;
    color:#41525b;z-index:20;pointer-events:none;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ver"></div>
<div id="hud">
  <div class="row">抑えた <b id="sec">0</b> 秒</div>
  <div class="sm" id="sm"></div>
</div>
<div id="bar"><div id="barIn"></div></div>
<div id="tip">なぞって乳酸菌を集め 腐敗菌を輪で囲め。触れても無害 ─ 酸に晒し続ければ鎮まる</div>
<button id="reset" class="btn">やり直す</button>
<div id="over">
  <div class="t">腐敗菌に埋め尽くされた</div>
  <div class="s" id="overS"></div>
  <button id="again">もう一度</button>
</div>

<script>
'use strict';
// 公開ごとに stamp.py が書き換える。画面左下に出して、更新されたか一目で分かるようにする
const BUILD='v29 (07-28 14:34)';
try{ document.getElementById('ver').textContent=BUILD; }catch(e){}
// ============================================================
//  「囲って増殖を抑える」
//  ・乳酸は殺菌ではなく静菌。腐敗菌(桿菌)は触れても何も起きない＝ぶつかる概念が無い。
//    恐いのは分裂して倍々に増えること＝指数増殖そのものが時計になる。
//  ・球菌(乳酸菌)で輪を作ると内側が酸性になり、中の桿菌は増殖が止まる（死なない）。
//  ・酸は中和されて薄れる → また増え始める → 塗り直す。
//  ・集めた球菌の数 ÷ 輪の周長 = 酸の濃さ = 効き目の持続時間。
//  ・★短時間なら止まるだけだが、低pHに晒され続けると弱って死ぬ（非解離型の乳酸が
//    細胞内に入り代謝を壊す＝長時間では殺菌的に働く）。これが無いと"一時停止"に
//    しかならず、プレイヤーは決して盛り返せない＝抑えている実感が生まれなかった。
//  ・★乳酸菌も分裂して増える。自分が作った酸性領域は乳酸菌の縄張りなので、
//    輪の球菌がそこで増える＝抑制と同時に増殖工場を作ることになる。
//    これが無いと1つの輪に24秒分の供給を使い切り、9秒で倍増する腐敗菌に勝てない。
// ============================================================
const cv=document.getElementById('cv'), g=cv.getContext('2d');
const elSec=document.getElementById('sec'), elSm=document.getElementById('sm'), elBar=document.getElementById('barIn');
let W,H,DPR;

const SCALE=1.25;
const COC_R=6.2*SCALE*0.92;
const SPACING=10.2*SCALE;
const CATCH_R=40*SCALE;
const ROD_L=17*SCALE, ROD_W=6.0*SCALE;

const PLAY_TOP=104;
function playBot(){ return H-30; }

const DIV_T=13.0;        // 腐敗菌の倍加時間。経済を立ち上げる猶予が要る
const DIV_JIT=0.35;
const ROD_START=4;
const LOSE_N=100;
const ROD_SPEED=2.2;     // ほとんど動かない＝コロニーを作る。散らばると1回の輪が
                         // 全体のごく一部しか触れず、行動の手応えが消える
const COVER=28;          // 球菌1個が受け持つ輪の長さ。大きいほど輪が安く作れる
const LIFE_BASE=18;
const LIFE_MAX=42;
const COC_MAX=80;
const COC_SPAWN=1.2;      // どこにも領域が無い時の湧き（立ち上げと詰み防止）
// ★外から雑菌が入り続ける（実際の発酵現場でも常に起きること）。
//   これが無いと全滅させた時点でやることが無くなる。時間とともに侵入が激しくなる
const INVADE0=10.0;       // 最初の侵入間隔(秒)
const INVADE_MIN=2.6;
const INVADE_RAMP=0.085;  // 1秒ごとに間隔が縮む量
function invadeInterval(){ return Math.max(INVADE_MIN, INVADE0-elapsed*INVADE_RAMP); }
// ★達成できる目標。常に敗北で終わる構造だと、上手くやっても敗北の記憶しか残らない
const GOALS=[30,60,90,130];
const BREED=0.11;         // 輪の球菌1個あたりの増殖速度(/秒)。倍加約6.3秒。
                          // 腐敗菌の倍加13秒より速い＝上手く回せば押し返せる
const MIN_AREA=2200;
const KILL_T=7.0;         // 酸に晒され続けて死ぬまでの秒数
// 成立ライン：球菌8個・半径40pxの輪 → 濃さ0.89 → 持続16秒 ≥ 7秒 で確実に鎮まる
const RELIEF=0.22;        // 酸から出た時に回復する速さ(/秒)

let rods=[], cocci=[], zones=[], bits=[];
let best=+(localStorage.getItem('containBest')||0);
let elapsed=0, clock=0, alive=true, shake=0, hudT=0, cocT=0, quelled=0, invT=0;
let goalIdx=0, goalFlash=0, won=false;

function rnd(a,b){return a+Math.random()*(b-a);}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

function addRod(x,y){
  rods.push({x,y,ang:Math.random()*Math.PI*2, div:DIV_T*rnd(1-DIV_JIT,1+DIV_JIT),
             phase:Math.random()*6.28, split:0, born:1, held:false, stress:0});
}
function addCoccus(x,y){
  if(cocci.length>=COC_MAX) return;
  if(x==null){ x=rnd(30,W-30); y=rnd(PLAY_TOP+20, playBot()-20); }
  cocci.push({x,y,phase:Math.random()*6.28,joined:false,born:1});
}
function reset(){
  resize();
  rods=[]; cocci=[]; zones=[]; bits=[];
  elapsed=0; alive=true; shake=0; hudT=0; cocT=0; quelled=0; invT=0;
  goalIdx=0; goalFlash=0; won=false;
  for(let i=0;i<ROD_START;i++) addRod(rnd(50,W-50), rnd(PLAY_TOP+40, playBot()-40));
  for(let i=0;i<16;i++) addCoccus();
  chain=[]; path=[]; dragging=false; orderSeq=0;
  document.getElementById('over').classList.remove('on');
  document.getElementById('tip').style.opacity=1;
  updateHud();
}
function updateHud(){
  elSec.textContent=Math.floor(elapsed);
  const held=rods.filter(r=>r.held).length;
  const nextGoal=goalIdx<GOALS.length? GOALS[goalIdx]:null;
  elSm.textContent='腐敗菌 '+rods.length+'/'+LOSE_N+'　鎮めた '+quelled
    +(nextGoal? '　次の目標 '+nextGoal+'秒':'　完走');
  elBar.style.width=Math.min(100, rods.length/LOSE_N*100).toFixed(1)+'%';
}
function tipMsg(t){ const e=document.getElementById('tip'); e.textContent=t; e.style.opacity=1; }

// ---------------- 幾何 ----------------
function segInt(p1,p2,p3,p4){
  const d1x=p2.x-p1.x,d1y=p2.y-p1.y, d2x=p4.x-p3.x,d2y=p4.y-p3.y;
  const den=d1x*d2y-d1y*d2x; if(Math.abs(den)<1e-6) return null;
  const t=((p3.x-p1.x)*d2y-(p3.y-p1.y)*d2x)/den;
  const u=((p3.x-p1.x)*d1y-(p3.y-p1.y)*d1x)/den;
  if(t>=0&&t<=1&&u>=0&&u<=1) return {x:p1.x+d1x*t, y:p1.y+d1y*t};
  return null;
}
function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y, xj=poly[j].x,yj=poly[j].y;
    if(((yi>py)!==(yj>py)) && (px<(xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function polyArea(poly){
  let s=0; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ s+=(poly[j].x+poly[i].x)*(poly[j].y-poly[i].y); }
  return Math.abs(s/2);
}
function polyPerimeter(poly){
  let s=0;
  for(let i=0;i<poly.length;i++){ const a=poly[i], b=poly[(i+1)%poly.length];
    s+=Math.hypot(b.x-a.x,b.y-a.y); }
  return s;
}
// 輪の縁に球菌をn個等間隔で並べる
function beadsOn(poly,n){
  const out=[], per=polyPerimeter(poly);
  if(per<1||n<1) return out;
  const step=per/n;
  let i=0, rem=Math.hypot(poly[1].x-poly[0].x, poly[1].y-poly[0].y), acc=0, cur=0;
  for(let k=0;k<n;k++){
    let d=k*step, walked=0, seg=0;
    for(seg=0;seg<poly.length;seg++){
      const a=poly[seg], b=poly[(seg+1)%poly.length];
      const L=Math.hypot(b.x-a.x,b.y-a.y);
      if(walked+L>=d){ const t=(d-walked)/Math.max(0.001,L);
        out.push({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}); break; }
      walked+=L;
    }
    if(seg>=poly.length) out.push({x:poly[0].x,y:poly[0].y});
  }
  return out;
}

// ---------------- 入力 ----------------
let dragging=false, path=[], chain=[], orderSeq=0;
let head={x:0,y:0}, prevHead={x:0,y:0}, sealCd=0;
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function start(x,y){
  cocci.forEach(c=>{c.joined=false;});
  chain=[]; orderSeq=0;
  dragging=true; path=[{x,y}]; head={x,y}; prevHead={x,y}; sealCd=0;
  ac(); catchNear(x,y);
}
function moveTo(x,y){
  if(!dragging||!alive) return;
  const last=path[path.length-1];
  if(Math.hypot(x-last.x,y-last.y)>3){ path.push({x,y}); if(path.length>600)path.shift(); }
  head={x,y}; catchNear(x,y);
  if(sealCd<=0) checkClose();
}
function end(){ dragging=false; chain.forEach(c=>{c.joined=false;}); chain=[]; path=[]; orderSeq=0; }
function catchNear(x,y){
  for(const c of cocci){
    if(c.joined) continue;
    if(Math.hypot(c.x-x,c.y-y)<=CATCH_R){
      c.joined=true; c.order=orderSeq++; c.b=null; c.follow=0.30;
      chain.push(c); pop(chain.length);
    }
  }
}
function checkClose(){
  const n=path.length; if(n<8||chain.length===0) return;
  const a=path[n-2], b=path[n-1];
  for(let i=0;i<n-3;i++){
    const c=path[i], d=path[i+1];
    const X=segInt(a,b,c,d);
    if(X){
      const poly=[X]; for(let k=i+1;k<n;k++) poly.push(path[k]);
      if(polyArea(poly)<MIN_AREA) return;
      makeZone(poly);
      path=[{x:X.x,y:X.y},{x:b.x,y:b.y}];
      sealCd=0.2;
      return;
    }
  }
}
// 輪が閉じた＝集めた球菌が縁に並んで酸性領域になる
function makeZone(poly){
  const per=polyPerimeter(poly);
  const n=chain.length;
  const dens=(n*COVER)/Math.max(1,per);          // 酸の濃さ
  const life=Math.min(LIFE_MAX, LIFE_BASE*dens);
  const beads=beadsOn(poly,n);
  zones.push({poly, life, life0:life, dens, beads, flash:1, prod:0});
  // 使った球菌は輪に消費される
  for(const c of chain){ const i=cocci.indexOf(c); if(i>=0) cocci.splice(i,1); }
  chain=[]; orderSeq=0;
  let caught=0;
  for(const r of rods) if(pointInPoly(r.x,r.y,poly)) caught++;
  sealSnd(n,dens);
  if(life<KILL_T) tipMsg('酸が薄い！ '+Math.round(life)+'秒しか保たない（'+Math.round(KILL_T)+'秒で鎮まる）─ もっと小さく囲め');
  else if(caught===0) tipMsg('腐敗菌を囲めていない');
  else{
    const canKill = life>=KILL_T;
    tipMsg(caught+'匹を封じ込めた（酸は約'+Math.round(life)+'秒）'+(canKill? '　このまま鎮まる':'　※'+Math.round(KILL_T)+'秒未満だと鎮めきれない'));
  }
  updateHud();
}
cv.addEventListener('mousedown',e=>{if(!alive)return;const p=pos(e);start(p.x,p.y);});
cv.addEventListener('mousemove',e=>{const p=pos(e);moveTo(p.x,p.y);});
window.addEventListener('mouseup',()=>{if(dragging)end();});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(!alive)return;const p=pos(e.changedTouches[0]);start(p.x,p.y);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const p=pos(e.changedTouches[0]);moveTo(p.x,p.y);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(dragging)end();},{passive:false});
cv.addEventListener('touchcancel',e=>{e.preventDefault();if(dragging)end();},{passive:false});
document.getElementById('reset').addEventListener('click',reset);
document.getElementById('again').addEventListener('click',reset);

// ---------------- 更新 ----------------
function update(dt){
  elapsed+=dt;
  if(sealCd>0) sealCd-=dt;

  // 酸性領域は中和されて薄れる
  for(const z of zones){ z.life-=dt; if(z.flash>0) z.flash-=dt*2.2; }
  const gone=zones.filter(z=>z.life<=0);
  if(gone.length) tipMsg('酸が中和された ─ また増え始める');
  zones=zones.filter(z=>z.life>0);

  // 桿菌：酸性領域の中では増えない・動かない（死なない）
  const add=[];
  for(const r of rods){
    r.held=false;
    for(const z of zones){ if(pointInPoly(r.x,r.y,z.poly)){ r.held=true; break; } }
    if(r.born>0) r.born-=dt*2;
    if(r.split>0) r.split-=dt*3.2;
    if(r.held){
      r.phase+=dt*0.4;
      r.stress+=dt/KILL_T;          // 酸に晒され続けると弱る
      if(r.stress>=1){ r.dead=true; }
      continue;
    }
    if(r.stress>0) r.stress=Math.max(0, r.stress-RELIEF*dt);   // 酸から出れば持ち直す
    r.phase+=dt*1.6;
    // ゆっくり泳ぐ
    r.ang+=rnd(-0.9,0.9)*dt;
    r.x+=Math.cos(r.ang)*ROD_SPEED*dt;
    r.y+=Math.sin(r.ang)*ROD_SPEED*dt;
    if(r.x<20){r.x=20;r.ang=Math.PI-r.ang;} if(r.x>W-20){r.x=W-20;r.ang=Math.PI-r.ang;}
    if(r.y<PLAY_TOP+12){r.y=PLAY_TOP+12;r.ang=-r.ang;} if(r.y>playBot()-12){r.y=playBot()-12;r.ang=-r.ang;}
    // 分裂
    r.div-=dt;
    if(r.div<=0){
      r.div=DIV_T*rnd(1-DIV_JIT,1+DIV_JIT);
      r.split=1;
      const a=r.ang+Math.PI/2;
      add.push({x:r.x+Math.cos(a)*ROD_L*0.6, y:r.y+Math.sin(a)*ROD_L*0.6});
      divSnd();
    }
  }
  for(const p of add) addRod(p.x,p.y);

  // 酸に負けた個体を取り除く
  let killedThisFrame=0;
  const survivors=[];
  for(const r of rods){
    if(r.dead){
      quelled++; killedThisFrame++;
      for(let k=0;k<10;k++) bits.push({x:r.x,y:r.y,vx:rnd(-1.1,1.1),vy:rnd(-1.2,.3),life:1,r:rnd(1.2,3)});
    }else survivors.push(r);
  }
  if(survivors.length!==rods.length){
    rods=survivors;
    quellSnd(killedThisFrame);
    if(killedThisFrame>=2){ shake=Math.max(shake,3.5); tipMsg(killedThisFrame+'匹まとめて鎮まった！'); }
    updateHud();
  }

  // ★輪を作る球菌は酸性領域の中で分裂して増える（＝抑制と同時に増殖工場になる）
  for(const z of zones){
    z.prod += z.beads.length*BREED*dt;
    while(z.prod>=1){
      z.prod-=1;
      if(cocci.length>=COC_MAX) break;
      let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
      for(const p of z.poly){ minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y); }
      let placed=false;
      for(let t=0;t<14 && !placed;t++){
        const x=rnd(minx,maxx), y=rnd(miny,maxy);
        if(pointInPoly(x,y,z.poly)){ addCoccus(x,y); placed=true; }
      }
      if(!placed) break;
    }
  }
  // 領域が1つも無い時だけ、詰み防止に細々と湧く
  cocT+=dt;
  if(cocT>=COC_SPAWN){ cocT=0; if(!zones.length) addCoccus(); }

  // 外から雑菌が侵入する（縁から入ってくる）
  invT+=dt;
  if(invT>=invadeInterval()){
    invT=0;
    const side=Math.floor(Math.random()*4);
    let x,y;
    if(side===0){ x=rnd(24,W-24); y=PLAY_TOP+16; }
    else if(side===1){ x=rnd(24,W-24); y=playBot()-16; }
    else if(side===2){ x=24; y=rnd(PLAY_TOP+24, playBot()-24); }
    else { x=W-24; y=rnd(PLAY_TOP+24, playBot()-24); }
    addRod(x,y);
    invadeSnd();
  }

  // 段階目標
  if(goalIdx<GOALS.length && elapsed>=GOALS[goalIdx]){
    const reached=GOALS[goalIdx];
    goalIdx++; goalFlash=1.6;
    goalSnd(goalIdx);
    if(goalIdx>=GOALS.length){ win(); }
    else tipMsg(reached+'秒 突破！ 次は'+GOALS[goalIdx]+'秒');
  }
  if(goalFlash>0) goalFlash-=dt;
  if(rods.length>=LOSE_N && alive) lose();
  hudT+=dt; if(hudT>=0.25){ hudT=0; updateHud(); }
}
function win(){
  won=true; alive=false; dragging=false;
  const s=Math.floor(elapsed);
  if(s>best){ best=s; localStorage.setItem('containBest',best); }
  const o=document.getElementById('over');
  o.querySelector('.t').textContent='守り切った！';
  o.querySelector('.t').style.color='#8ff0c0';
  document.getElementById('overS').innerHTML=GOALS[GOALS.length-1]+' 秒を完走<br>鎮めた腐敗菌 <b>'+quelled+' 匹</b>';
  o.classList.add('on');
  winSnd();
}
function lose(){
  alive=false; dragging=false;
  const s=Math.floor(elapsed);
  if(s>best){ best=s; localStorage.setItem('containBest',best); }
  const o=document.getElementById('over');
  o.querySelector('.t').textContent='腐敗菌に埋め尽くされた';
  o.querySelector('.t').style.color='#ff9a80';
  const cleared=goalIdx>0? GOALS[goalIdx-1]+'秒を突破':'目標未達';
  document.getElementById('overS').innerHTML='抑え込んだ時間 <b>'+s+' 秒</b>（'+cleared+'）<br>鎮めた腐敗菌 <b>'+quelled+' 匹</b><br>これまで最長 '+best+' 秒';
  document.getElementById('over').classList.add('on');
  loseSnd();
}

// ---------------- 音 ----------------
let A=null;
function ac(){ if(!A){ try{A=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(A&&A.state==='suspended')A.resume(); }
function pop(n){ if(!A)return; try{
  const t=A.currentTime, o=A.createOscillator(), gg=A.createGain();
  const base=520+Math.min(n,40)*26;
  o.type='sine'; o.frequency.setValueAtTime(base,t); o.frequency.exponentialRampToValueAtTime(base*1.5,t+0.05);
  gg.gain.setValueAtTime(0.0001,t); gg.gain.exponentialRampToValueAtTime(0.18,t+0.008); gg.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(gg).connect(A.destination); o.start(t); o.stop(t+0.16);
}catch(e){} }
function sealSnd(n,dens){ if(!A)return; try{
  const t=A.currentTime, dur=0.3;
  const buf=A.createBuffer(1,Math.ceil(A.sampleRate*dur),A.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<ch.length;i++){ const e=1-i/ch.length; ch[i]=(Math.random()*2-1)*e*e; }
  const src=A.createBufferSource(); src.buffer=buf;
  const bp=A.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.setValueAtTime(1700,t); bp.frequency.exponentialRampToValueAtTime(520,t+dur); bp.Q.value=0.8;
  const gg=A.createGain(); gg.gain.setValueAtTime(0.1+Math.min(0.2,dens*0.14),t); gg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp).connect(gg).connect(A.destination); src.start(t); src.stop(t+dur);
  const chord=430+Math.min(n,26)*15;
  [0,4,7].forEach((iv,k)=>{ const o=A.createOscillator(), og=A.createGain();
    o.type='triangle'; o.frequency.value=chord*Math.pow(2,iv/12);
    og.gain.setValueAtTime(0.0001,t+k*0.035); og.gain.exponentialRampToValueAtTime(0.10,t+0.02+k*0.035);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.32+k*0.035);
    o.connect(og).connect(A.destination); o.start(t+k*0.035); o.stop(t+0.36+k*0.035); });
}catch(e){} }
function divSnd(){ if(!A)return; try{
  const t=A.currentTime, o=A.createOscillator(), og=A.createGain();
  o.type='square'; o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(120,t+0.1);
  const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800;
  og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.05,t+0.01); og.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  o.connect(lp).connect(og).connect(A.destination); o.start(t); o.stop(t+0.14);
}catch(e){} }
function invadeSnd(){ if(!A)return; try{
  const t=A.currentTime, o=A.createOscillator(), og=A.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(200,t+0.18);
  const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
  og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.055,t+0.03);
  og.gain.exponentialRampToValueAtTime(0.0001,t+0.24);
  o.connect(lp).connect(og).connect(A.destination); o.start(t); o.stop(t+0.26);
}catch(e){} }
function quellSnd(n){ if(!A)return; try{
  const t=A.currentTime, k=Math.max(1,n||1);
  for(let i=0;i<Math.min(k,4);i++){
    const o=A.createOscillator(), og=A.createGain();
    o.type='sine'; o.frequency.setValueAtTime(620+i*90,t+i*0.05);
    o.frequency.exponentialRampToValueAtTime((620+i*90)*1.8,t+i*0.05+0.14);
    og.gain.setValueAtTime(0.0001,t+i*0.05); og.gain.exponentialRampToValueAtTime(0.13,t+i*0.05+0.012);
    og.gain.exponentialRampToValueAtTime(0.0001,t+i*0.05+0.24);
    o.connect(og).connect(A.destination); o.start(t+i*0.05); o.stop(t+i*0.05+0.26);
  }
}catch(e){} }
function goalSnd(n){ if(!A)return; try{
  const t=A.currentTime, base=520+n*40;
  [0,4,7,12].forEach((iv,k)=>{ const o=A.createOscillator(), og=A.createGain();
    o.type='triangle'; o.frequency.value=base*Math.pow(2,iv/12);
    og.gain.setValueAtTime(0.0001,t+k*0.07); og.gain.exponentialRampToValueAtTime(0.11,t+0.02+k*0.07);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.5+k*0.07);
    o.connect(og).connect(A.destination); o.start(t+k*0.07); o.stop(t+0.56+k*0.07); });
}catch(e){} }
function winSnd(){ if(!A)return; try{
  const t=A.currentTime;
  [0,4,7,12,16,19].forEach((iv,k)=>{ const o=A.createOscillator(), og=A.createGain();
    o.type='triangle'; o.frequency.value=440*Math.pow(2,iv/12);
    og.gain.setValueAtTime(0.0001,t+k*0.11); og.gain.exponentialRampToValueAtTime(0.12,t+0.02+k*0.11);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.8+k*0.11);
    o.connect(og).connect(A.destination); o.start(t+k*0.11); o.stop(t+0.9+k*0.11); });
}catch(e){} }
function loseSnd(){ if(!A)return; try{
  const t=A.currentTime, o=A.createOscillator(), og=A.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(70,t+0.9);
  og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.14,t+0.03); og.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
  o.connect(og).connect(A.destination); o.start(t); o.stop(t+1.05);
}catch(e){} }

// ---------------- 鎖の追従 ----------------
function pointBack(d){
  let acc=0;
  for(let i=path.length-1;i>0;i--){
    const a=path[i], b=path[i-1];
    const seg=Math.hypot(a.x-b.x,a.y-b.y);
    if(acc+seg>=d){ const t=(d-acc)/Math.max(0.001,seg);
      return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
    acc+=seg;
  }
  const p=path[0]||head; return {x:p.x,y:p.y};
}

// ★描いている最中に「今この輪を閉じたら何秒保つか」を返す。
//   これが無いと、閉じる前に足りるか判断する手段が無く
//   「自分の操作が正しいのか分からない」状態になる
function previewLife(){
  if(!dragging || chain.length===0 || path.length<2) return null;
  let per=0;
  for(let i=1;i<path.length;i++) per+=Math.hypot(path[i].x-path[i-1].x, path[i].y-path[i-1].y);
  per+=Math.hypot(head.x-path[0].x, head.y-path[0].y);   // 今いる所から始点へ閉じたと仮定
  if(per<20) return null;
  const dens=(chain.length*COVER)/per;
  return {life:Math.min(LIFE_MAX, LIFE_BASE*dens), per};
}

// ---------------- 描画 ----------------
function drawCoccus(x,y,mode,alpha){
  g.save(); g.globalAlpha=alpha==null?1:alpha;
  if(mode==='chain'){ g.shadowColor='rgba(140,240,200,.9)'; g.shadowBlur=10; g.fillStyle='#c8ffe6'; g.strokeStyle='rgba(120,235,190,.9)'; }
  else if(mode==='ring'){ g.shadowColor='rgba(150,245,205,.7)'; g.shadowBlur=8; g.fillStyle='#bdf5dd'; g.strokeStyle='rgba(120,235,190,.8)'; }
  else { g.fillStyle='#e6f2f4'; g.strokeStyle='rgba(120,150,160,.55)'; }
  g.lineWidth=1;
  g.beginPath(); g.arc(x,y,COC_R,0,7); g.fill(); g.stroke();
  if(mode==='free'){ g.beginPath(); g.arc(x,y,COC_R+1.6,0,7);
    g.strokeStyle='rgba(150,190,200,.5)'; g.lineWidth=1.2; g.stroke(); }
  g.beginPath(); g.arc(x-COC_R*0.28,y-COC_R*0.28,COC_R*0.34,0,7);
  g.fillStyle='rgba(255,255,255,.3)'; g.fill();
  g.restore(); g.shadowBlur=0;
}
function drawRod(r){
  g.save(); g.translate(r.x,r.y); g.rotate(r.ang);
  const wob=r.held?0:Math.sin(r.phase*3)*0.14;
  g.rotate(wob);
  const weak=r.stress||0;
  const grow=(1+(r.split>0? r.split*0.35:0))*(1-weak*0.45);
  const h=ROD_L/2*grow, w=ROD_W/2*(1-weak*0.35);
  g.globalAlpha=1-weak*0.55;
  // 鞭毛（動いている個体だけ）
  if(!r.held){
    g.beginPath(); g.moveTo(-h,0);
    for(let i=1;i<=5;i++){ const t=i/5; g.lineTo(-h-t*ROD_L*0.7, Math.sin(r.phase*7+t*5)*3.2*t); }
    g.strokeStyle='rgba(200,140,175,.6)'; g.lineWidth=1.2; g.stroke();
  }
  g.beginPath(); g.arc(-h,0,w,Math.PI/2,Math.PI*1.5); g.arc(h,0,w,-Math.PI/2,Math.PI/2); g.closePath();
  if(r.held){ g.fillStyle='rgba(108,80,100,.72)'; g.strokeStyle='rgba(150,120,145,.5)'; }
  else { g.fillStyle='rgba(176,84,124,.95)'; g.strokeStyle='rgba(228,140,180,.75)'; g.shadowColor='rgba(190,70,120,.5)'; g.shadowBlur=6; }
  g.lineWidth=1; g.fill(); g.stroke(); g.shadowBlur=0;
  if(r.split>0){ g.beginPath(); g.moveTo(0,-w); g.lineTo(0,w);
    g.strokeStyle='rgba(255,220,235,'+(0.9*r.split)+')'; g.lineWidth=2; g.stroke(); }
  if(r.born>0){ g.beginPath(); g.arc(0,0,ROD_L*0.7*(1-r.born)+6,0,7);
    g.strokeStyle='rgba(255,150,190,'+(0.5*r.born)+')'; g.lineWidth=2; g.stroke(); }
  // 弱り具合を縮んでいく輪で示す（あと少しで鎮まる、が見える）
  if(weak>0.04){
    g.globalAlpha=1;
    g.beginPath(); g.arc(0,0,ROD_L*0.75*(1-weak)+3,0,7);
    g.strokeStyle='rgba(150,245,205,'+(0.25+0.6*weak)+')'; g.lineWidth=1.8; g.stroke();
  }
  g.restore();
}
function drawZone(z){
  const k=Math.max(0,Math.min(1,z.life/Math.max(0.001,z.life0)));
  g.save();
  g.beginPath(); g.moveTo(z.poly[0].x,z.poly[0].y);
  for(let i=1;i<z.poly.length;i++) g.lineTo(z.poly[i].x,z.poly[i].y);
  g.closePath();
  g.fillStyle='rgba(120,235,190,'+(0.05+0.16*k)+')'; g.fill();
  g.strokeStyle='rgba(150,245,205,'+(0.15+0.4*k)+')'; g.lineWidth=1.5; g.stroke();
  if(z.flash>0){ g.strokeStyle='rgba(200,255,230,'+(0.7*z.flash)+')'; g.lineWidth=3+4*z.flash; g.stroke(); }
  g.restore();
  // 鎮圧の進み具合（中の桿菌の平均の弱り具合）を輪の内側の弧で見せる
  let sum=0, cnt=0;
  for(const r of rods) if(r.held && pointInPoly(r.x,r.y,z.poly)){ sum+=r.stress; cnt++; }
  if(cnt>0){
    const prog=sum/cnt;
    let cx=0,cy=0; for(const p of z.poly){cx+=p.x;cy+=p.y;} cx/=z.poly.length; cy/=z.poly.length;
    let rad=0; for(const p of z.poly) rad=Math.max(rad,Math.hypot(p.x-cx,p.y-cy));
    g.save();
    g.beginPath(); g.arc(cx,cy,rad*0.72,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);
    g.strokeStyle='rgba(160,255,215,'+(0.35+0.45*prog)+')'; g.lineWidth=3; g.stroke();
    g.restore();
  }
  for(const b of z.beads) drawCoccus(b.x,b.y,'ring',0.35+0.65*k);
}
let tms=0;
function loop(ts){
  const dt=Math.min(0.05,(tms?ts-tms:16)/1000); tms=ts; clock+=dt;
  if(alive) update(dt);

  g.save();
  if(shake>0.2){ const s=shake; g.translate(rnd(-s,s),rnd(-s,s)); shake*=0.86; } else shake=0;
  g.clearRect(-40,-40,W+80,H+80);
  const bg=g.createRadialGradient(W/2,H*0.45,60,W/2,H*0.45,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#12202a'); bg.addColorStop(1,'#0b0f14'); g.fillStyle=bg; g.fillRect(-40,-40,W+80,H+80);

  for(const z of zones) drawZone(z);
  for(const r of rods) drawRod(r);

  for(const b of bits){ b.x+=b.vx; b.y+=b.vy; b.life-=dt*1.6;
    if(b.life>0){ g.beginPath(); g.arc(b.x,b.y,b.r*b.life,0,7); g.fillStyle='rgba(160,245,200,'+(0.7*b.life)+')'; g.fill(); } }
  bits=bits.filter(b=>b.life>0);

  // 浮遊している球菌
  for(const c of cocci){ if(c.joined) continue;
    c.phase+=dt*1.5;
    if(c.born>0) c.born-=dt*2.2;
    drawCoccus(c.x+Math.sin(c.phase)*0.6, c.y+Math.cos(c.phase*0.8)*0.6,'free');
  }

  // なぞり線
  if(dragging && path.length>1){
    g.beginPath(); g.moveTo(path[0].x,path[0].y);
    for(let i=1;i<path.length;i++) g.lineTo(path[i].x,path[i].y);
    g.lineTo(head.x,head.y);
    const pv=previewLife();
    let col='rgba(140,240,200,.20)', glow='rgba(140,240,200,.45)';
    if(pv){
      if(pv.life>=KILL_T){ col='rgba(140,240,200,.30)'; glow='rgba(140,240,200,.6)'; }
      else if(pv.life>=KILL_T*0.55){ col='rgba(245,200,120,.30)'; glow='rgba(245,200,120,.5)'; }
      else { col='rgba(255,120,100,.28)'; glow='rgba(255,120,100,.45)'; }
    }
    g.strokeStyle=col; g.lineWidth=COC_R*2+4; g.lineCap='round'; g.lineJoin='round';
    g.shadowColor=glow; g.shadowBlur=10; g.stroke(); g.shadowBlur=0;
    // 始点へ閉じる線を点線で見せる（どこで閉じられるかが分かる）
    if(pv){
      g.save(); g.setLineDash([5,7]);
      g.beginPath(); g.moveTo(head.x,head.y); g.lineTo(path[0].x,path[0].y);
      g.strokeStyle=col; g.lineWidth=2; g.stroke(); g.restore();
    }
  }
  // 鎖
  const headAdv=dragging? Math.hypot(head.x-prevHead.x, head.y-prevHead.y):0;
  const sorted=chain.slice().sort((a,b)=>a.order-b.order);
  for(let k=0;k<sorted.length;k++){
    const c=sorted[k], ideal=(sorted.length-1-k+1)*SPACING;
    if(c.b==null) c.b=ideal;
    c.b+=headAdv; c.b+=(ideal-c.b)*0.30;
    if(c.b>ideal+70) c.b=ideal+70;
    const tp=pointBack(c.b);
    c.follow=Math.min(1,(c.follow==null?1:c.follow)+dt*3.5);
    c.x+=(tp.x-c.x)*c.follow; c.y+=(tp.y-c.y)*c.follow;
    drawCoccus(c.x,c.y,'chain');
  }
  if(dragging){
    g.beginPath(); g.arc(head.x,head.y,7,0,7);
    g.fillStyle='rgba(200,255,230,.9)'; g.shadowColor='#8ff0c0'; g.shadowBlur=16; g.fill(); g.shadowBlur=0;
    if(chain.length>0){
      g.save(); g.font='800 18px system-ui,-apple-system,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
      const bx=head.x, by=head.y-52;
      const pv2=previewLife();
      const ok = pv2? (pv2.life>=KILL_T? 2 : (pv2.life>=KILL_T*0.55?1:0)) : 2;
      const ring = ok===2? 'rgba(140,250,200,.95)' : (ok===1? 'rgba(245,200,120,.95)':'rgba(255,130,105,.95)');
      const txt  = ok===2? '#a6ffd4' : (ok===1? '#ffd88a':'#ff9a80');
      g.beginPath(); g.arc(bx,by,17,0,7); g.fillStyle='rgba(6,14,12,.82)'; g.fill();
      g.strokeStyle=ring; g.lineWidth=2; g.stroke();
      g.fillStyle=txt; g.fillText(chain.length,bx,by+1);
      if(pv2){
        g.font='800 13px system-ui,-apple-system,sans-serif';
        g.fillStyle=txt;
        g.fillText(pv2.life.toFixed(1)+'秒', bx, by-27);
        g.font='700 10.5px system-ui,-apple-system,sans-serif';
        g.fillStyle= ok===2? 'rgba(166,255,212,.8)':(ok===1?'rgba(255,216,138,.85)':'rgba(255,154,128,.9)');
        g.fillText(ok===2? '鎮まる':(ok===1?'止まるだけ':'薄すぎ'), bx, by-42);
      }
      g.restore();
    }
  }
  if(goalFlash>0){
    const k=Math.min(1,goalFlash/1.6);
    g.save();
    g.strokeStyle='rgba(150,245,205,'+(0.5*k)+')'; g.lineWidth=6;
    g.strokeRect(4,PLAY_TOP-6,W-8,playBot()-PLAY_TOP+12);
    g.font='800 26px system-ui,-apple-system,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillStyle='rgba(160,255,215,'+(0.9*k)+')';
    g.fillText(goalIdx<GOALS.length? GOALS[goalIdx-1]+'秒 突破！':'完走！', W/2, H*0.34);
    g.restore();
  }
  prevHead.x=head.x; prevHead.y=head.y;
  g.restore();
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
window.__dbg={rods:()=>rods,cocci:()=>cocci,zones:()=>zones,chain:()=>chain,quelled:()=>quelled,won:()=>won,goal:()=>goalIdx,
  held:()=>rods.filter(r=>r.held).length, alive:()=>alive, elapsed:()=>elapsed,
  addRod:(x,y)=>addRod(x,y)};
</script>
